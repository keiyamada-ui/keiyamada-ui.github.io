{%- comment -%}
記事の中の広告（AdSense の広告ユニット）。「楽天で見る」ボタンのすぐそばには置かない（押し間違いを防ぐ）。
運営者 ID と広告ユニットの番号が _config.yml に入っているときだけ出る。
{%- endcomment -%}
{%- if site.google_adsense != "" and site.google_adsense_slot != "" -%}
<div class="ad">
  <span class="ad-label">スポンサーリンク</span>
  <ins class="adsbygoogle" style="display:block; text-align:center;" data-ad-layout="in-article" data-ad-format="fluid"
       data-ad-client="{{ site.google_adsense }}" data-ad-slot="{{ site.google_adsense_slot }}"></ins>
  <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
</div>
{%- endif -%}
