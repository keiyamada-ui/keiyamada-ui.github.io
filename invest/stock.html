<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>銘柄｜ことり投資ノート</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#FBF6EF">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<link rel="stylesheet" href="app.css">
<style>
  .hero { display: flex; align-items: center; gap: 16px; }
  .ring { --p: 0; --c: var(--accent); width: 112px; height: 112px; border-radius: 50%; flex: none; display: grid; place-items: center;
          background: conic-gradient(var(--c) calc(var(--p) * 1%), var(--box) 0); transition: --p 1s; }
  .ring > div { width: 92px; height: 92px; border-radius: 50%; background: var(--card); display: grid; place-items: center; text-align: center; }
  .ring b { font-family: var(--num); font-size: 36px; font-weight: 900; line-height: 1; display: block; }
  .ring small { font-size: 11px; color: var(--sub); font-weight: 700; }
  .hero .info2 { min-width: 0; flex: 1; }
  .hero .code { color: var(--sub); font-size: 13px; font-weight: 700; }
  .hero .price { font-family: var(--num); font-size: 22px; font-weight: 900; margin-top: 4px; }
  .hero .price small { font-size: 12px; color: var(--sub); font-weight: 700; margin-left: 4px; font-family: var(--font); }

  .contrib { display: grid; grid-template-columns: 72px 1fr 52px; align-items: center; gap: 4px 10px; padding: 8px 0; border-top: 1px dashed var(--line); }
  .contrib:first-of-type { border-top: 0; }
  .contrib .nm { font-weight: 900; font-size: 14px; }
  .contrib .nm small { display: block; font-size: 11px; color: var(--sub); font-weight: 700; }
  .contrib .bar { height: 10px; border-radius: 99px; background: var(--box); overflow: hidden; }
  .contrib .bar i { display: block; height: 100%; border-radius: 99px; }
  .contrib .pt { text-align: right; font-family: var(--num); font-weight: 900; font-size: 15px; }
  .contrib .pt small { display: block; font-size: 10.5px; color: var(--sub); font-weight: 700; font-family: var(--font); }
  .contrib .how { grid-column: 2 / -1; font-size: 11.5px; color: var(--sub); margin-top: -2px; }
  .adj { display: flex; justify-content: space-between; gap: 8px; font-size: 13.5px; padding: 7px 0; border-top: 1px dashed var(--line); }
  .adj small { display: block; color: var(--sub); font-size: 12px; }
  .adj b { font-family: var(--num); white-space: nowrap; }
  .adj.plus b { color: var(--ok); } .adj.minus b { color: var(--pr); }
  .totalline { display: flex; justify-content: space-between; align-items: baseline; padding-top: 10px; margin-top: 4px; border-top: 2px solid var(--line); font-weight: 900; }
  .totalline b { font-family: var(--num); font-size: 22px; }

  .grouptitle { font-size: 12.5px; font-weight: 900; color: var(--sub); margin: 14px 2px 8px; display: flex; align-items: center; gap: 6px; }
  .grouptitle i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .links { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .links a { display: flex; align-items: center; gap: 8px; padding: 12px; border-radius: 16px; background: var(--box); text-decoration: none; font-size: 13.5px; font-weight: 700; }
  .links a small { display: block; font-size: 11px; color: var(--sub); font-weight: 500; }
  .rule .calc { display: flex; gap: 8px; margin-top: 8px; }
  .rule .calc div { flex: 1; text-align: center; border-radius: 14px; padding: 8px; }
  .rule .calc span { display: block; font-size: 11px; font-weight: 700; color: var(--sub); }
  .rule .calc b { font-family: var(--num); font-size: 17px; font-weight: 900; }
  .ai .runrow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .ai .runrow button { text-align: left; border: 1.5px solid var(--line); background: var(--card); border-radius: 18px; padding: 11px 12px; cursor: pointer;
                       color: inherit; box-shadow: var(--shadow); transition: transform .12s; }
  .ai .runrow button:active { transform: scale(.97); }
  .ai .runrow button:disabled { opacity: .5; }
  .ai .runrow b { display: block; font-size: 14.5px; font-weight: 900; }
  .ai .runrow small { display: block; font-size: 11.5px; color: var(--sub); }
  .ai .runrow button.main { background: var(--accent-bg); border-color: var(--accent); box-shadow: 0 3px 0 var(--accent-deep), var(--shadow); }
  .ai .runrow .tagline { display: inline-block; font-size: 10.5px; font-weight: 900; color: #9A6A10; background: #fff; border-radius: 999px; padding: 1px 7px; margin-bottom: 4px; }
  .ai .billing { display: flex; align-items: center; gap: 8px; margin-top: 8px; padding: 9px 12px; border-radius: 14px; background: var(--box);
                 text-decoration: none; font-size: 12.5px; color: var(--sub); }
  .ai .billing b { color: var(--text); font-weight: 900; }
  .ai .billing::after { content: "↗"; margin-left: auto; font-weight: 900; }
  .ai .body { margin-top: 12px; font-size: 14px; line-height: 1.85; }
  .ai .body h4 { font-size: 15px; font-weight: 900; margin: 16px 0 4px; padding-left: 10px; border-left: 4px solid var(--accent); }
  .ai .body h5 { font-size: 14px; font-weight: 900; margin: 12px 0 2px; }
  .ai .body p { margin: 4px 0; }
  .ai .body ul { margin: 4px 0; padding-left: 20px; }
  .ai .body li { margin: 2px 0; }
  .ai .meta2 { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
  .ai .waiting { display: flex; align-items: center; gap: 12px; margin-top: 12px; background: var(--box); border-radius: 16px; padding: 12px; font-size: 13.5px; }
  .ai .waiting img { width: 44px; height: 44px; animation: hop 1.4s ease-in-out infinite; }
  @keyframes hop { 0%, 60%, 100% { transform: translateY(0) } 75% { transform: translateY(-7px) rotate(-4deg) } }
  .principle { font-size: 12.5px; color: var(--sub); line-height: 1.7; background: var(--box); border-radius: 14px; padding: 10px 12px; margin-bottom: 4px; }
  .tm .head2 { display: flex; align-items: center; gap: 12px; }
  .tm .lbl { font-size: 20px; font-weight: 900; }
  .tm .pricebox { margin-left: auto; text-align: right; }
  .tm .pricebox b { font-family: var(--num); font-size: 20px; font-weight: 900; display: block; }
  .tm .pricebox small { font-size: 11.5px; color: var(--sub); }
  .tm .legend { display: flex; gap: 12px; font-size: 11px; color: var(--sub); font-weight: 700; margin-top: 4px; }
  .tm .legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
  .sig { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; padding: 9px 0; border-top: 1px dashed var(--line); align-items: start; }
  .sig .k { font-size: 11px; font-weight: 900; border-radius: 999px; padding: 2px 8px; margin-top: 1px; text-align: center; }
  .sig .k.buy { background: var(--ok-bg); color: var(--ok); } .sig .k.sell { background: var(--pr-bg); color: var(--pr); } .sig .k.info { background: var(--box); color: var(--sub); }
  .sig b { font-size: 14px; font-weight: 900; } .sig small { grid-column: 2; color: var(--sub); font-size: 12px; line-height: 1.6; }
  .rsibar { position: relative; height: 8px; border-radius: 99px; background: linear-gradient(90deg, var(--ok-bg) 0 30%, var(--box) 30% 70%, var(--pr-bg) 70%); margin: 6px 0 2px; }
  .rsibar i { position: absolute; top: -3px; width: 4px; height: 14px; border-radius: 2px; background: var(--text); transform: translateX(-50%); }
  .nw a { display: flex; gap: 8px; align-items: flex-start; padding: 8px 0; border-top: 1px dashed var(--line); text-decoration: none; font-size: 13.5px; font-weight: 700; line-height: 1.5; }
  .nw a:first-of-type { border-top: 0; }
  .nw small { display: block; color: var(--sub); font-weight: 500; font-size: 11.5px; }
  .nw .side { flex: none; font-size: 11px; font-weight: 900; border-radius: 999px; padding: 2px 8px; margin-top: 2px; }
  .nw .side.pos { background: var(--ok-bg); color: var(--ok); } .nw .side.neg { background: var(--pr-bg); color: var(--pr); } .nw .side.mix { background: var(--box); color: var(--sub); }
</style>
</head>
<body>
<header class="top"><a class="back" href="ranking.html" aria-label="ランキングに戻る">‹</a><h1 id="title">銘柄</h1>
  <div class="right"><button class="iconbtn" id="watch" aria-label="ウォッチリストに追加">☆</button></div></header>
<main id="main"></main>

<script src="app.js"></script>
<script>
const code = new URLSearchParams(location.search).get("c") || "";
if (document.referrer && !document.referrer.includes("ranking.html")) document.querySelector("a.back").href = "javascript:history.back()";
$("main").replaceChildren(...skeleton(3));

function setWatch() { const on = Watch.has(code); $("watch").textContent = on ? "★" : "☆"; $("watch").classList.toggle("watch-on", on); }
$("watch").addEventListener("click", () => { const on = Watch.toggle(code); setWatch(); toast(on ? "ウォッチリストに追加しました" : "ウォッチリストから外しました"); });
setWatch();

const RANKCOLOR = { S: "#F2B33D", A: "#4AA57A", B: "#3D8BD8", C: "#8D7BC9", D: "#BDB3A8" };
const FCOLOR = { profit: "--f-profit", growth: "--f-growth", value: "--f-value", dividend: "--f-dividend", quality: "--f-quality", safety: "--f-safety" };

function render(data) {
  const w = weightsFor(data);
  const list = scoreAll(data, w);
  const s = data.byCode.get(code);
  if (!s) {
    $("title").textContent = code;
    $("main").replaceChildren(el("section", { class: "card" }, [
      el("div", { class: "empty", html: `コード <b>${code.replace(/[<>&"]/g, "")}</b> は採点の対象に入っていません🐤<br>上場して間もない・決算データが足りない・ETFなどが考えられます。` }),
      el("div", { class: "links" }, [
        el("a", { href: `https://kabutan.jp/stock/?code=${encodeURIComponent(code)}`, target: "_blank", rel: "noopener", text: "📰 株探で見る" }),
        el("a", { href: `https://finance.yahoo.co.jp/quote/${encodeURIComponent(code)}.T`, target: "_blank", rel: "noopener", text: "💹 Yahoo!ファイナンス" })])]));
    return;
  }
  $("title").textContent = s.n || s.c;
  document.title = `${s.n}｜ことり投資ノート`;

  const delta = deltaEl(s);
  const hero = el("section", { class: "card rise" }, [
    el("div", { class: "hero" }, [
      el("div", { class: "ring", style: { "--p": Math.round(s.score), "--c": RANKCOLOR[s.rank] } }, [el("div", {}, [el("div", {}, [el("b", { text: Math.round(s.score) }), el("small", { text: "/ 100点" })])])]),
      el("div", { class: "info2" }, [
        el("div", { class: "row" }, [rankEl(s.rank), el("span", { class: "title", text: `${s.rank}ランク` }), delta]),
        el("div", { class: "code", text: `${s.c}　${s.m || ""}　全${list.length.toLocaleString()}社中 ${s.pos}位` }),
        el("div", { class: "price", html: `${fmt.yen(s.p)}<small>${fmt.md(data.price_date)}時点</small>` }),
        el("div", { class: "muted", text: "時価総額 " + fmt.oku(s.mc) }),
      ])]),
    (s.b.length || s.f.length) ? el("div", { class: "row", style: { marginTop: "12px" } }, [
      ...s.b.map(b => el("span", { class: "badge star", text: "★ " + b })), ...s.f.map(f => el("span", { class: "badge warn", text: "⚠ " + f }))]) : null,
  ]);

  // 点数の内訳
  const rows = FACTOR_KEYS.filter(k => w[k] > 0).map(k => el("div", { class: "contrib" }, [
    el("div", { class: "nm" }, [FACTOR_LONG[k], el("small", { text: `配分 ${w[k]}点` })]),
    el("div", { class: "bar" }, [el("i", { style: { width: s.s[k] + "%", background: `var(${FCOLOR[k]})` } })]),
    el("div", { class: "pt" }, [((s.s[k] * w[k]) / 100).toFixed(1), el("small", { text: `順位 ${Math.round(s.s[k])}点` })]),
    el("div", { class: "how", text: FACTOR_HOW[k] })]));
  const adjs = [...s.b.map(b => el("div", { class: "adj plus" }, [el("span", {}, ["★ " + b, el("small", { text: BONUS_DESC[b] || "" })]), el("b", { text: "+" + data.bonus[b] })])),
                ...s.f.map(f => el("div", { class: "adj minus" }, [el("span", {}, ["⚠ " + f, el("small", { text: FLAG_DESC[f] || "" })]), el("b", { text: "−" + data.penalty[f] })]))];
  const breakdown = el("section", { class: "card rise" }, [
    el("div", { class: "row between" }, [el("span", { class: "title", text: "🧮 点数の内訳" }), el("span", { class: "badge gray", text: "配分：" + STYLE_NAMES[currentStyle()] })]),
    el("p", { class: "muted", style: { margin: "4px 0 6px" }, text: "「順位」は全銘柄の中での位置（100点＝いちばん良い）。それに配分を掛けて合計します。" }),
    ...rows, ...adjs,
    el("div", { class: "totalline" }, [el("span", { text: "合計" }), el("b", { text: Math.round(s.score) + "点" })])]);

  // 数字
  const kv = (pairs) => el("div", { class: "kv" }, pairs.map(([k, v]) => el("div", {}, [el("span", { text: k }), el("b", { html: v })])));
  const group = (k, title) => el("div", { class: "grouptitle" }, [el("i", { style: { background: `var(${FCOLOR[k]})` } }), title]);
  const numbers = el("section", { class: "card rise" }, [
    el("span", { class: "title", text: "📊 数字で見る" }),
    group("profit", "収益性"), kv([["ROE", fmt.pct(s.roe)], ["営業利益率", fmt.pct(s.opm)]]),
    group("growth", "成長性"), kv([["売上の伸び", fmt.pct(s.sg)], ["営業利益の伸び", fmt.pct(s.og)], ["予想EPSの伸び", fmt.pct(s.eg)], ["会社予想の修正（営業利益）", fmt.pct(s.rev)], ["進捗率" + (s.pt ? `（${s.pt}時点）` : ""), s.prg == null ? "–" : fmt.pct(s.prg) + (s.pgap == null ? "" : `（標準より${s.pgap >= 0 ? "+" : ""}${(s.pgap * 100).toFixed(0)}pt）`)]]),
    group("value", "割安性"), kv([["予想PER", s.fper ? s.fper.toFixed(1) + "<small>倍</small>" : "–"], ["実績PER", s.per ? s.per.toFixed(1) + "<small>倍</small>" : "–"],
                                  ["PBR", s.pbr ? s.pbr.toFixed(2) + "<small>倍</small>" : "–"]]),
    group("dividend", "増配余力"), kv([["ROE−DOE", fmt.pct(s.rd)], ["DOE", fmt.pct(s.doe)], ["予想配当", s.dps ? s.dps.toFixed(1) + "<small>円</small>" : "–"],
                                       ["配当利回り", fmt.pct(s.dy)], ["株主資本の伸び", fmt.pct(s.eqg)]]),
    group("quality", "利益の質・健全性"), kv([["営業CF÷純利益", s.cfo !== null ? s.cfo.toFixed(2) + "<small>倍</small>" : "–"], ["自己資本比率", fmt.pct(s.eqr)],
                                              ["1日の売買代金", s.va ? fmt.oku(s.va) : "–"]]),
  ]);

  // 事前ルールメモ（この端末に保存）
  const memoKey = "invest-rule-" + code;
  const memo = store.get(memoKey, { reason: "", target: "", stop: "", review: "" });
  const calc = el("div", { class: "calc" });
  const updCalc = () => {
    const t = parseFloat(memo.target), st = parseFloat(memo.stop), p = s.p;
    const pct = v => (v / p - 1) * 100;
    calc.replaceChildren(
      el("div", { style: { background: "var(--up-bg)" } }, [el("span", { text: "目標まで" }), el("b", { style: { color: "var(--up)" }, text: t && p ? (pct(t) >= 0 ? "+" : "") + pct(t).toFixed(1) + "%" : "–" })]),
      el("div", { style: { background: "var(--down-bg)" } }, [el("span", { text: "損切りまで" }), el("b", { style: { color: "var(--down)" }, text: st && p ? pct(st).toFixed(1) + "%" : "–" })]),
      el("div", { style: { background: "var(--box)" } }, [el("span", { text: "損益の比率" }), el("b", { text: t && st && p && p > st ? ((t - p) / (p - st)).toFixed(1) + " : 1" : "–" })]));
  };
  const field = (k, label, type, ph) => {
    const input = type === "area" ? el("textarea", { id: "m-" + k, placeholder: ph }) : el("input", { id: "m-" + k, type, inputmode: type === "number" ? "decimal" : null, placeholder: ph });
    input.value = memo[k] || "";
    input.addEventListener("input", () => { memo[k] = input.value; store.set(memoKey, memo); updCalc(); });
    return [el("label", { class: "field", for: "m-" + k, html: label }), input];
  };
  updCalc();
  const rule = el("section", { class: "card rule rise" }, [
    el("span", { class: "title", text: "📝 事前ルールメモ" }),
    el("div", { class: "principle", style: { marginTop: "8px" }, html: "感情ではなく<b>事前ルール</b>で。買う前に「なぜ買うか・どこで利益を確定するか・どこで損切りするか」を決めておく。<br>頭と尻尾はくれてやれ。" }),
    ...field("reason", "買う理由（成長ストーリー） <small>崩れたら売る、の基準になります</small>", "area", "例：ニッチ分野で世界シェア首位。営業利益率が高く、毎年増収増益"),
    el("div", { class: "row", style: { gap: "10px", alignItems: "flex-start" } }, [
      el("div", { style: { flex: 1 } }, field("target", "目標株価（円）", "number", "例：" + Math.round((s.p || 1000) * 1.3))),
      el("div", { style: { flex: 1 } }, field("stop", "損切りライン（円）", "number", "例：" + Math.round((s.p || 1000) * 0.9)))]),
    calc,
    ...field("review", "見直す日・条件", "text", "例：次の決算（2月）で減益なら見直す"),
    el("p", { class: "muted", style: { margin: "10px 2px 0" }, text: "このメモはこの端末の中だけに保存されます。株価が基準日のものなので、実際の株価で確認してください。" }),
  ]);

  const L = (href, icon, name, sub) => el("a", { href, target: "_blank", rel: "noopener" }, [el("span", { text: icon }), el("span", {}, [name, el("small", { text: sub })])]);
  const links = el("section", { class: "card rise" }, [
    el("span", { class: "title", text: "🔎 くわしく確かめる" }),
    el("p", { class: "muted", style: { margin: "4px 0 10px" }, text: "チャートの形（逆三尊・三尊天井など）や最新ニュース、会社の方針（DOEの書き方など）はここで確認。" }),
    el("div", { class: "links" }, [
      L(`https://www.tradingview.com/chart/?symbol=TSE%3A${code}`, "📈", "チャート", "TradingView"),
      L(`https://kabutan.jp/stock/?code=${code}`, "📰", "株探", "決算・開示・ニュース"),
      L(`https://finance.yahoo.co.jp/quote/${code}.T`, "💹", "Yahoo!ファイナンス", "最新の株価・掲示板"),
      L(`https://irbank.net/${code}`, "📚", "IR BANK", "長期の業績推移"),
      L(`https://www.google.com/search?q=${encodeURIComponent((s.n || code) + " 配当方針 DOE")}`, "🎯", "配当方針", "DOEの書き方を確認"),
      L(`https://news.google.com/search?q=${encodeURIComponent(s.n || code)}&hl=ja&gl=JP&ceid=JP:ja`, "🗞️", "ニュース", "Googleニュース"),
    ])]);

  // タグ（要監視・買い候補など）
  const tagBox = el("div", { class: "chips", style: { margin: "8px -16px 0", flexWrap: "wrap" } });
  const drawTags = () => {
    const on = Tags.of(code);
    tagBox.replaceChildren(...Tags.defs().map(d => el("button", { class: "chip soft", "aria-pressed": String(on.includes(d.id)), text: d.label,
      onclick: () => { const added = Tags.toggle(code, d.id); setWatch(); drawTags(); toast(added ? `「${d.label}」を付けました` : `「${d.label}」を外しました`); } })),
      el("a", { class: "chip", href: "watch.html#tags", text: "＋ タグを作る" }));
  };
  drawTags();
  const tags = el("section", { class: "card rise" }, [
    el("div", { class: "row between" }, [el("span", { class: "title", text: "🏷️ タグ" }), el("a", { class: "muted", href: "watch.html", text: "ウォッチ一覧へ ›" })]),
    el("p", { class: "muted", style: { margin: "4px 0 0" }, text: "付けるとウォッチに入り、タグごとに一覧で見られます。" }), tagBox]);

  // AI分析
  const aiBody = el("div");
  const aiCard = el("section", { class: "card ai rise" }, [
    el("div", { class: "row between" }, [el("span", { class: "title", text: "🤖 AI分析" }), el("span", { class: "badge gray", text: "参考情報" })]),
    el("p", { class: "muted", style: { margin: "4px 0 0" }, text: "点数・決算の数字と最新ニュースをAIが読み、強み・リスク・確認すべきことをまとめます（1〜2分）。" }),
    el("div", { class: "runrow" }, Object.entries(AI).map(([k, a]) => el("button", { "data-ai": k, class: k === "gemini" ? "main" : null, onclick: () => startAI(k) }, [
      el("span", { class: "tagline", text: k === "gemini" ? "いつもはこちら" : "じっくり見たいとき" }),
      el("b", { text: `${a.icon} ${a.name}で分析` }), el("small", { text: a.cost })]))),
    el("a", { class: "billing", href: "https://platform.claude.com/settings/billing", target: "_blank", rel: "noopener",
      html: "💳 <span><b>Claudeの残高を確認・チャージ</b><br>Claude Console の支払い画面を開きます</span>" }),
    aiBody]);
  let history = [], showIdx = 0;
  const drawAI = () => {
    if (!history.length) { aiBody.replaceChildren(el("div", { class: "muted", style: { marginTop: "12px" }, text: "まだ分析していません。上のボタンで始められます。" })); return; }
    const h = history[showIdx];
    aiBody.replaceChildren(
      el("div", { class: "meta2" }, [
        ...history.map((x, i) => el("button", { class: "chip" + (i === showIdx ? "" : " soft"), "aria-pressed": String(i === showIdx),
          text: `${AI[x.ai] ? AI[x.ai].icon : "🤖"} ${new Date(x.created_at).toLocaleDateString("ja-JP", { month: "numeric", day: "numeric" })}`,
          onclick: () => { showIdx = i; drawAI(); } }))]),
      el("div", { class: "muted", style: { marginTop: "6px", fontSize: "12px" }, text: `${h.model}・株価は${fmt.md(h.price_date)}時点のデータで分析` }),
      el("div", { class: "body" }, mdToEls(h.markdown)),
      h.news && h.news.length ? el("details", {}, [el("summary", { text: `参考にしたニュースの見出し（${h.news.length}件）` }),
        el("ul", { style: { fontSize: "12.5px", paddingLeft: "18px", lineHeight: "1.7" } }, h.news.map(n =>
          el("li", {}, [el("a", { href: n.url, target: "_blank", rel: "noopener", text: n.title }), " ", el("span", { class: "muted", text: n.date })])))]) : null);
  };
  const loadAI = async () => {
    try { const doc = await fetchAnalysis(code); history = doc ? doc.history : []; showIdx = 0; drawAI(); }
    catch (e) { aiBody.replaceChildren(el("div", { class: "warnbox", style: { marginTop: "12px" }, text: e.message })); }
  };
  async function startAI(model) {
    if (!Key.get()) { location.href = "key.html"; return; }
    aiCard.querySelectorAll("[data-ai]").forEach(b => { b.disabled = true; });
    const wait = el("div", { class: "waiting" }, [el("img", { src: "avatar.png", alt: "" }), el("span", { text: `${AI[model].name}が分析しています…` })]);
    aiBody.prepend(wait);
    try {
      const r = await runAnalysis(code, model, sec => { wait.lastChild.textContent = `${AI[model].name}が分析しています…（${sec}秒）`; });
      if (r.ok) { toast("分析ができました"); await loadAI(); }
      else {
        wait.replaceWith(el("div", { class: "warnbox", style: { marginTop: "12px" }, html: r.timeout ? "時間がかかっています。少ししてから開き直してください。"
          : (model === "claude"
              ? `うまくいきませんでした。Claudeの<b>残高が足りない</b>か、Secret の <b>ANTHROPIC_API_KEY</b> の期限が切れている可能性があります。 <a href="https://platform.claude.com/settings/billing" target="_blank" rel="noopener">残高を確認・チャージ</a>`
              : `うまくいきませんでした。Geminiの無料枠を使い切ったか、Secret の <b>GEMINI_API_KEY</b> に問題がある可能性があります。少し時間をおくか、Claudeで試してください。`) +
            (r.url ? ` <a href="${r.url}" target="_blank" rel="noopener">記録を見る</a>` : "") }));
      }
    } catch (e) { wait.replaceWith(el("div", { class: "warnbox", style: { marginTop: "12px" }, text: e.message })); }
    aiCard.querySelectorAll("[data-ai]").forEach(b => { b.disabled = false; });
  }
  aiBody.replaceChildren(el("div", { class: "muted", style: { marginTop: "12px" }, text: "読み込み中…" }));
  loadAI();

  // チャートと買い時（毎日更新のチャート判定）
  const tmCard = el("section", { class: "card tm rise" });
  const drawTiming = () => {
    const t = timingOf(code);
    if (!t) {
      tmCard.replaceChildren(el("span", { class: "title", text: "📈 チャートと買い時" }),
        el("p", { class: "muted", style: { margin: "6px 0 0" }, html: CHART
          ? "この銘柄はまだチャートを調べていません。ウォッチに入れて、<a href='market.html'>市場の画面</a>の 🔄 で更新すると調べます（毎日の自動更新でも対象になります）。"
          : "チャートのデータがまだありません。<a href='market.html'>市場の画面</a>の 🔄 で最初の更新を始められます。" }));
      return;
    }
    const sigs = (t.sig || []).map(k => ({ k, ...(CHART.signals[k] || { name: k, side: "info", horizon: "", desc: "" }) }));
    const sp = t.spark || [];
    const lines = [{ vals: movingAvg(sp, 25), color: "#F2A93B" }, { vals: movingAvg(sp, 75), color: "#8D7BC9" }];
    if (t.neck) lines.push({ vals: sp.map(() => t.neck), color: "var(--ok)", dash: "5 4", width: 1 });
    if (t.neck_top) lines.push({ vals: sp.map(() => t.neck_top), color: "var(--pr)", dash: "5 4", width: 1 });
    const feps = s.fper && s.p ? s.p / s.fper : null;
    const freshPer = feps && feps > 0 ? t.p / feps : null;
    const weather = MARKET && MARKET.regime;
    tmCard.replaceChildren(
      el("div", { class: "head2" }, [
        el("div", {}, [el("div", { class: "muted", text: "📈 チャートから見た買い時" }), el("div", { class: "lbl", text: t.label }),
          el("span", { class: "badge " + (TIMING_STYLE[t.label] || "gray"), text: `タイミング ${t.score}点・${t.trend}トレンド` })]),
        el("div", { class: "pricebox" }, [el("b", { text: fmt.yen(t.p) }),
          el("small", {}, [fmt.md(t.date) + "　", el("span", { class: "delta " + (t.chg1d > 0 ? "up" : t.chg1d < 0 ? "down" : "flat"), text: t.chg1d == null ? "" : (t.chg1d > 0 ? "+" : "") + (t.chg1d * 100).toFixed(1) + "%" })])])]),
      el("div", { style: { margin: "12px -4px 0" } }, [sparkSVG(sp, { w: 320, h: 140, color: t.trend === "下降" ? "#3577C4" : "#D9485F", lines })]),
      el("div", { class: "legend" }, [el("span", {}, [el("i", { style: { background: "#F2A93B" } }), "25日線"]), el("span", {}, [el("i", { style: { background: "#8D7BC9" } }), "75日線"]),
        t.neck ? el("span", {}, [el("i", { style: { background: "var(--ok)" } }), "逆三尊のネックライン"]) : null,
        t.neck_top ? el("span", {}, [el("i", { style: { background: "var(--pr)" } }), "三尊天井のネックライン"]) : null, el("span", { text: `約${sp.length}日` })]),
      el("div", { class: "kv", style: { marginTop: "10px" } }, [
        el("div", {}, [el("span", { text: "RSI（14日）" }), el("b", { text: t.rsi ?? "–" }), el("div", { class: "rsibar" }, [el("i", { style: { left: (t.rsi || 0) + "%" } })])]),
        el("div", {}, [el("span", { text: "最新株価での予想PER" }), el("b", { html: freshPer ? freshPer.toFixed(1) + "<small>倍</small>" : "–" })]),
        el("div", {}, [el("span", { text: "1か月の値動き" }), el("b", { text: t.chg1m == null ? "–" : (t.chg1m > 0 ? "+" : "") + (t.chg1m * 100).toFixed(1) + "%" })]),
        el("div", {}, [el("span", { text: "52週高値まで" }), el("b", { text: t.hi52 ? ((t.p / t.hi52 - 1) * 100).toFixed(1) + "%" : "–" })])]),
      el("div", { style: { marginTop: "8px" } }, sigs.length ? sigs.map(g => el("div", { class: "sig" }, [
        el("span", { class: "k " + g.side, text: g.side === "buy" ? "買い" : g.side === "sell" ? "売り" : "注目" }),
        el("b", { text: `${g.name}${g.horizon ? "（" + g.horizon + "）" : ""}` }), el("small", { text: g.desc })])) : [el("div", { class: "muted", text: "目立ったサインはありません。" })]),
      weather ? el("div", { class: weather.score < 40 ? "warnbox" : "info", style: { marginTop: "10px", marginBottom: 0 },
        html: `市場の天気は <b>${weather.icon} ${weather.label}</b>（${weather.score}点）。${weather.score < 40 ? "買う場合は分割で、損切りラインを決めてから。" : weather.desc}` }) : null,
      el("p", { class: "muted", style: { fontSize: "11.5px", margin: "8px 0 0" }, text: "チャートの形は機械的な検出で、だまし（外れ）もあります。決算・ニュースと合わせて判断してください。" }));
  };
  // この銘柄のニュース（見出しと適時開示）
  const nwCard = el("section", { class: "card nw rise" });
  const drawNews = () => {
    const ev = NEWS && NEWS.events ? NEWS.events[code] || [] : [];
    if (!NEWS || !ev.length) { nwCard.style.display = "none"; return; }
    nwCard.style.display = "";
    nwCard.replaceChildren(el("span", { class: "title", text: "📰 この銘柄のニュース・開示" }),
      el("div", { style: { marginTop: "6px" } }, ev.map(e => el("a", { href: e.u, target: "_blank", rel: "noopener" }, [
        el("span", { class: "side " + (e.side || "mix"), text: e.side === "pos" ? "追い風" : e.side === "neg" ? "向かい風" : "情報" }),
        el("span", {}, [e.t, el("small", { text: `${e.s}・${(e.d || "").slice(0, 10)}` })])]))));
  };
  drawTiming(); drawNews();
  loadChart(drawTiming); loadMarket(drawTiming); loadNews(drawNews);

  $("main").replaceChildren(hero, tmCard, tags, aiCard, nwCard, breakdown, numbers, rule, links);
}
loadData(render, e => keyNeeded($("main"), e));
</script>
