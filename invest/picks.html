<body>
<header class="top"><a class="back" href="./" aria-label="ホームに戻る">‹</a><h1>🐤 今日の3選</h1></header>
<p class="note">「会社の良さ・チャートの形・市場より強いか（RS）・業績の勢い・割安さ」の5つを、短期向け・中長期向けの2通りの配分で合計し、毎営業日の夕方に3銘柄ずつ選びます。2週間後の成績を自動で採点して毎週金曜にまとめて発表し、当たった観点の配分を少しずつ増やして精度を上げていきます。勉強用の記録で、売買のおすすめではありません。</p>

<script>

  b.push(el("p", { class: "muted", style: { margin: "0 4px 10px", fontSize: "12.5px" }, text: DT.desc }));

          el("div", { class: "dt" }, [el("span", { text: `${md(d.date)}（${d.mode}）` }), el("span", { class: cls(d.pnl), text: yen(d.pnl) })]),
          ...(d.trades.length ? d.trades.map(tline) : [el("div", { class: "muted", style: { fontSize: "12px" }, text: "売買なし" })])])));

    b.push(el("h2", { text: "🤖 模擬売買（自動売買のルールで売買していたら）" }),

      el("div", { class: "kpi" }, [
        el("div", {}, [el("b", { class: (st.pnl || 0) >= 0 ? "up" : "down", text: st.trades ? yen(st.pnl) : "–" }), el("small", { text: `損益の合計（${st.days || 0}日）` })]),
        el("div", {}, [el("b", { text: st.win == null ? "–" : Math.round(st.win * 100) + "%" }), el("small", { text: `勝率（${st.trades || 0}回売買）` })]),
        el("div", {}, [el("b", { text: (PP.queue || []).length + "件" }), el("small", { text: "結果待ち" })])]),

        el("div", { class: "dt" }, [el("span", { text: `${md(d.date)} 選定 → ${md(d.on)} 売買` }), el("span", { class: d.pnl > 0 ? "up" : d.pnl < 0 ? "down" : "", text: yen(d.pnl) })]),
        ...d.rows.map(r => el("div", { style: { padding: "4px 0", borderTop: "1px dashed var(--line)", fontSize: "12.5px" } }, [
          el("b", { text: r.n }), " ", el("span", { class: r.pnl > 0 ? "up" : r.pnl < 0 ? "down" : "", text: r.trades.length ? yen(r.pnl) : "" }),
          el("div", { class: "muted", style: { fontSize: "11.5px" }, text: r.trades.length ? r.trades.map(t => `${t.t} ${t.side === "buy" ? "買" : "売"} ${t.qty}株@${t.price}（${t.why}）`).join(" → ") : r.note })]))])));
  }
  b.push(el("h2", { text: "📊 デイトレの通算成績（翌日の寄り→引け）" }), kpis(DT.stats, "最初の結果は、翌営業日の取引が終わってから出ます"));
  b.push(...DT.history.filter(d => d.picks.length).slice(0, 20).map(d => el("div", { class: "day" }, [

  b.push(el("h2", { text: "🧠 ことりの勉強ノート（デイトレ）" }), el("section", { class: "card lesson" }, (DT.learn.text || []).map(x => el("p", { text: x }))));
  const ic = DT.learn.ic || {};
  b.push(el("section", { class: "card" }, [el("div", { class: "wt" }, Object.keys(DT.feats).map(k => el("div", {}, [el("span", { text: DT.feats[k] }), el("i", { style: { "--w": Math.round(DT.weights[k] * 250) + "%" } }),

function render() {

  const set = t && t.sets && t.sets[K];

  b.push(...P.history.filter(d => (d.sets[K] || []).length).slice(0, 20).map(d => el("div", { class: "day" }, [
    el("div", { class: "dt" }, [el("span", { text: md(d.date) + " の3選" }), el("span", {}, ["TOPIX ", sg(d.b10)])]),
    ...d.sets[K].map(p => el("a", { href: `stock.html?c=${p.c}` }, [el("span", { text: p.n }), el("b", {}, [sg(p.r10)]),
      el("small", { text: p.x10 == null ? "" : `差 ${pctTxt(p.x10)}` })]))])));

  b.push(el("h2", { text: "🧠 ことりの勉強ノート" }));
  b.push(el("section", { class: "card lesson" }, (S.learn.text || []).map(x => el("p", { text: x }))));
  const ic = S.learn.ic || {}, w0 = S.history && S.history[0] ? S.history[0].w : null;
  b.push(el("section", { class: "card" }, [el("div", { class: "muted", style: { marginBottom: "8px", fontSize: "12px" }, text: "いまの点数の配分（小さい数字は2週間後の成績との相関。プラスほど「当たっている」観点）" }),
    el("div", { class: "wt" }, Object.keys(P.feats).map(k => el("div", {}, [el("span", { text: P.feats[k] }), el("i", { style: { "--w": Math.round(S.weights[k] * 200) + "%" } }),
      el("b", {}, [Math.round(S.weights[k] * 100) + "%", el("em", { text: S.learn.days && ic[k] != null ? ` ${ic[k] >= 0 ? "+" : ""}${ic[k].toFixed(2)}` : "" })])]))),
    w0 ? el("div", { class: "muted", style: { marginTop: "8px", fontSize: "11.5px" }, text: "はじめの配分: " + Object.keys(P.feats).map(k => `${P.feats[k].replace(/（.*）/, "")} ${Math.round(w0[k] * 100)}%`).join("・") }) : ""]));
  $("main").replaceChildren(...b);
}
loadJSON("data/picks.json", d => { P = d; render(); }, e => keyNeeded($("main"), e));

loadJSON("data/daytrade.json", d => { DT = d; render(); }, () => {}, true);
