<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>ランキング｜ことり投資ノート</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#FBF6EF">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<link rel="stylesheet" href="app.css">
<style>
  .controls { position: sticky; top: 58px; z-index: 9; margin: 0 -16px 8px; padding: 2px 16px 8px;
              background: color-mix(in srgb, var(--bg) 92%, transparent); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
  .controls .chips { margin-top: 2px; }
  .sortrow { display: flex; align-items: center; gap: 8px; margin: 6px 2px 0; }
  .sortrow select { width: auto; flex: none; padding: 7px 30px 7px 12px; font-size: 13px; font-weight: 700; border-radius: 999px; background: var(--card);
                    background-image: linear-gradient(45deg, transparent 50%, var(--sub) 50%), linear-gradient(135deg, var(--sub) 50%, transparent 50%);
                    background-position: calc(100% - 15px) 52%, calc(100% - 10px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
  .count { color: var(--sub); font-size: 12.5px; margin-left: auto; font-weight: 700; }
  .explain { margin: 0 2px 10px; }
  .more { text-align: center; padding: 14px 0; color: var(--sub); font-size: 13px; }
  .divcol { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
  .divcol div { background: var(--box); border-radius: 12px; padding: 7px 8px; text-align: center; }
  .divcol span { display: block; font-size: 10.5px; color: var(--sub); font-weight: 700; }
  .divcol b { font-family: var(--num); font-size: 15px; font-weight: 900; }
  .divcol .hl { background: var(--p-lilac); }
</style>
</head>
<body>
<header class="top"><a class="back" href="./" aria-label="ホームに戻る">‹</a><h1>🏅 ランキング</h1>
  <div class="right"><button class="iconbtn" id="stylebtn" aria-label="配分を変える">🎚️</button></div></header>

<div class="tabs" role="tablist">
  <button class="tab" id="t-all" role="tab">総合</button>
  <button class="tab" id="t-dividend" role="tab">増配余力</button>
  <button class="tab" id="t-timing" role="tab">買い場</button>
  <button class="tab" id="t-caution" role="tab">要注意</button>
</div>

<div class="controls">
  <div class="search"><input type="search" id="q" placeholder="銘柄名・コードでさがす" enterkeyhint="search" autocomplete="off"></div>
  <div class="chips" id="filters"></div>
  <div class="sortrow">
    <select id="sort" aria-label="並べ替え"></select>
    <span class="count" id="count"></span>
  </div>
</div>
<div class="explain" id="explain"></div>
<div id="list"></div>
<div class="more" id="more"></div>

<script src="app.js"></script>
<script>
let DATA = null, LIST = [], tab = "all", shown = 0;
const PAGE = 40;
const F = store.get("invest-rank-filters", { ranks: [], markets: [], star: false, noflag: true });
const SORTS = {
  all: [["score", "総合点が高い順"], ["delta", "前回から上がった順"], ["roe", "ROEが高い順"], ["fper", "予想PERが低い順"],
        ["dy", "配当利回りが高い順"], ["rd", "ROE−DOEが大きい順"], ["mc", "時価総額が大きい順"]],
  dividend: [["rd", "ROE−DOEが大きい順"], ["eqg", "株主資本の伸び順"], ["dy", "配当利回りが高い順"], ["score", "総合点が高い順"]],
  caution: [["roe", "見かけのROEが高い順"], ["score", "総合点が高い順"]],
  timing: [["tscore", "タイミングの点数順"], ["score", "総合点が高い順"]],
};
const EXPLAIN = {
  all: "",
  dividend: "DOE＝配当÷株主資本。<b>ROE−DOE</b>が大きいほど利益の多くが会社に残って株主資本が増え、将来の増配の余地が大きい（配当のある会社・⚠なしのみ）。",
  timing: "チャートの形（押し目・逆三尊の突破・ゴールデンクロスなど）が<b>買い場候補・やや良い</b>の銘柄。総合点と合わせて見ると「良い会社を良いタイミングで」に近づきます（チャートは平日の夕方に更新）。",
  caution: "ROE15%以上で、⚠が付いた銘柄。一時的な利益や計算のずれで<b>数字だけ良く見えている</b>可能性があります。飛びつく前に確認を。",
};

function chip(label, pressed, onclick, soft) {
  return el("button", { class: "chip" + (soft ? " soft" : ""), "aria-pressed": String(pressed), text: label, onclick });
}
function renderFilters() {
  const save = () => { store.set("invest-rank-filters", F); renderFilters(); apply(); };
  const toggle = (arr, v) => { const i = arr.indexOf(v); i >= 0 ? arr.splice(i, 1) : arr.push(v); save(); };
  $("filters").replaceChildren(
    ...["S", "A", "B"].map(r => chip(r + "ランク", F.ranks.includes(r), () => toggle(F.ranks, r))),
    ...["プライム", "スタンダード", "グロース"].map(m => chip(m, F.markets.includes(m), () => toggle(F.markets, m), true)),
    chip("★あり", F.star, () => { F.star = !F.star; save(); }, true),
    tab !== "caution" ? chip("⚠を除く", F.noflag, () => { F.noflag = !F.noflag; save(); }, true) : null,
  );
}
function renderSort() {
  const cur = $("sort").value;
  $("sort").replaceChildren(...SORTS[tab].map(([k, l]) => el("option", { value: k, text: l })));
  if (SORTS[tab].some(([k]) => k === cur)) $("sort").value = cur;
}

function apply() {
  if (!DATA) return;
  const q = $("q").value.trim().toLowerCase();
  let list = scoreAll(DATA, weightsFor(DATA));
  if (tab === "dividend") list = list.filter(s => s.rd !== null && s.dps > 0 && !s.f.length);
  if (tab === "caution") list = list.filter(s => s.f.length && s.roe !== null && s.roe >= 0.15);
  if (tab === "timing") list = list.filter(s => timingOf(s.c) && ["買い場候補", "やや良い"].includes(timingOf(s.c).label));
  list = list.filter(s =>
    (!q || s.c.toLowerCase().includes(q) || (s.n || "").toLowerCase().includes(q)) &&
    (!F.ranks.length || F.ranks.includes(s.rank)) &&
    (!F.markets.length || F.markets.some(m => (s.m || "").includes(m))) &&
    (!F.star || s.b.length) && (tab === "caution" || !F.noflag || !s.f.length));
  const key = $("sort").value || SORTS[tab][0][0];
  const desc = (a, b, f) => (b[f] ?? -Infinity) - (a[f] ?? -Infinity);
  const sorter = {
    score: (a, b) => b.score - a.score,
    delta: (a, b) => ((a.prevPos ?? 1e9) - a.pos > (b.prevPos ?? 1e9) - b.pos ? -1 : 1),
    fper: (a, b) => (a.fper > 0 ? a.fper : 1e9) - (b.fper > 0 ? b.fper : 1e9),
    tscore: (a, b) => (timingOf(b.c)?.score || 0) - (timingOf(a.c)?.score || 0) || b.score - a.score,
  }[key] || ((a, b) => desc(a, b, key));
  LIST = list.sort(sorter);
  $("count").textContent = `${LIST.length.toLocaleString()}社`;
  $("list").replaceChildren(); shown = 0; more();
}

function row(s) {
  if (tab !== "dividend") return stockRow(s, { showPos: !$("q").value && $("sort").value === "score" });
  const r = stockRow(s, { showPos: false });
  r.querySelector(".meta").replaceWith(el("div", { class: "divcol" }, [
    el("div", { class: "hl" }, [el("span", { text: "ROE−DOE" }), el("b", { text: fmt.pct(s.rd) })]),
    el("div", {}, [el("span", { text: "株主資本の伸び" }), el("b", { text: fmt.pct(s.eqg) })]),
    el("div", {}, [el("span", { text: "配当利回り" }), el("b", { text: fmt.pct(s.dy) })])]));
  return r;
}
function more() {
  const next = LIST.slice(shown, shown + PAGE);
  if (!shown && !next.length) $("list").append(el("div", { class: "empty", html: "条件に合う銘柄がありません🐤<br>絞り込みをゆるめてみてね" }));
  $("list").append(...next.map(row));
  shown += next.length;
  $("more").textContent = shown < LIST.length ? "読み込み中…" : LIST.length ? "ここまで🐤" : "";
}
new IntersectionObserver(es => { if (es[0].isIntersecting && shown < LIST.length) more(); }, { rootMargin: "600px" }).observe($("more"));

function setTab(name) {
  tab = name;
  for (const t of ["all", "dividend", "timing", "caution"]) $("t-" + t).setAttribute("aria-selected", String(t === name));
  history.replaceState(null, "", "#" + name);
  $("explain").replaceChildren(EXPLAIN[name] ? el("div", { class: "info", html: EXPLAIN[name] }) : "");
  renderSort(); $("sort").value = SORTS[name][0][0]; renderFilters(); apply();
}
for (const t of ["all", "dividend", "timing", "caution"]) $("t-" + t).addEventListener("click", () => setTab(t));
let timer; $("q").addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(apply, 150); });
$("sort").addEventListener("change", apply);

$("stylebtn").addEventListener("click", () => {
  const cur = currentStyle();
  const opts = Object.keys(STYLE_NAMES).filter(k => k !== "custom" || store.get("invest-custom-weights", null));
  openSheet([el("h3", { text: "🎚️ 何を重視して並べる？" }),
    el("p", { class: "muted", text: "選ぶとすぐに順位が入れ替わります。細かく決めたいときは「配分」画面へ。" }),
    ...opts.map(k => el("button", { class: "card tight", style: { width: "100%", textAlign: "left", cursor: "pointer", font: "inherit",
      outline: k === cur ? "2px solid var(--accent)" : "none" }, onclick: () => { setStyle(k); closeSheet(); apply(); toast(`「${STYLE_NAMES[k]}」で並べ替えました`); } },
      [el("div", { class: "title", text: (k === cur ? "✓ " : "") + STYLE_NAMES[k] }), el("div", { class: "muted", text: STYLE_DESC[k] })])),
    el("div", { class: "actions" }, [el("a", { class: "btn", href: "tune.html", text: "細かく調整する →" })])]);
});

$("list").replaceChildren(...skeleton(6));
const start = location.hash.slice(1);
setTab(["all", "dividend", "timing", "caution"].includes(start) ? start : "all");
loadChart(() => { if (DATA) apply(); });
loadData(d => { DATA = d; apply(); }, e => { keyNeeded($("list"), e); $("more").textContent = ""; });
</script>
</body>
</html>
