<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>コメント返し</title>
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#FBF6EF">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top"><a class="back" href="./" aria-label="管理画面に戻る">‹</a><h1>💬 コメント返し</h1></header>
<p class="note">自分の投稿についたコメントと、AI が考えた返信文の案です。「📋 コピーしてコメントを開く」→ 開いた返信欄に貼り付けて、自分で返してください。返したら「対応した」を押すと一覧から消えます（この端末に記録）。</p>

<section class="card">
  <div class="row between">
    <div class="muted" id="updated">読み込み中…</div>
    <button class="btn primary" id="refresh" style="flex:0 0 auto">🔄 今すぐ確認</button>
  </div>
  <div class="muted" id="progress" style="margin-top:6px"></div>
</section>
<div class="row" style="margin:0 0 12px">
  <button class="btn" id="filter" style="flex:0 0 auto" aria-pressed="true">未対応だけ</button>
</div>
<main id="list"></main>

<script src="app.js"></script>
<script>
const ACTION = { reply: ["💬 返信する", ""], like: ["❤️ いいねだけ", " ok"], ignore: ["🙈 返さない", " gray"] };
const KEY = "kotori-used-v1";  // 手動投稿ストックと同じ記録場所
const store = {
  get() { try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { return {}; } },
  set(v) { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch (e) {} },
};
let used = store.get(), onlyOpen = true, comments = [];
const list = document.getElementById("list");

function render() {
  list.replaceChildren();
  const items = comments.filter(c => !onlyOpen || !used["comment:" + c.id]);
  const left = comments.filter(c => c.action !== "ignore" && !used["comment:" + c.id]).length;
  list.append(el("p", { class: "note", "data-keep": "", text: `対応待ち ${left} 件。❤️ いいねだけ のものは、Threads で ♡ を押すだけで大丈夫です。` }));
  for (const c of items) {
    const key = "comment:" + c.id;
    const done = !!used[key];
    const [label, cls] = ACTION[c.action] || ACTION.reply;
    const card = el("section", { class: "card", style: done ? "opacity:.5" : "" }, [
      el("div", { class: "row" }, [el("span", { class: "badge" + cls, text: label })]),
      el("div", { class: "muted", style: "margin-top:6px", text: `@${c.username}　${jstTime(c.timestamp)}` }),
      el("div", { class: "text", text: c.text }),
      c.post_text || c.reason ? el("details", { class: "help", style: "margin-top:8px" }, [el("summary", { text: "くわしく" }),
        c.post_text ? el("div", { class: "muted", text: "自分の投稿: " + c.post_text.slice(0, 80) }) : null,
        c.reason ? el("div", { class: "muted", text: "AI の考え: " + c.reason }) : null]) : null,
    ]);
    if (c.reply_text) {
      card.append(el("div", { class: "muted", style: "margin-top:10px", text: "返信文の案（自由に直してOK）" }),
                  el("div", { class: "text", text: c.reply_text }));
    }
    const doneBtn = el("button", { class: "btn", text: done ? "✓ 対応した（戻す）" : "対応した" });
    doneBtn.addEventListener("click", () => {
      if (used[key]) delete used[key]; else used[key] = new Date().toISOString();
      store.set(used); render();
    });
    card.append(el("div", { class: "actions" }, [
      // コピーと、Threads でコメントを開くのを1回で（開いた返信欄に貼るだけ）
      c.reply_text && c.permalink ? el("button", { class: "btn primary", text: "📋 コピーしてコメントを開く", onclick: () => { copy(c.reply_text); window.open(c.permalink, "_blank", "noopener"); } })
        : c.reply_text ? el("button", { class: "btn primary", text: "返信文をコピー", onclick: () => copy(c.reply_text) })
        : c.permalink ? el("a", { class: "btn", text: "コメントを開く", href: c.permalink, target: "_blank", rel: "noopener" }) : null,
      doneBtn]));
    list.append(card);
  }
  if (!items.length) list.append(el("p", { class: "empty", text: comments.length ? "対応待ちのコメントはありません 🎉" : "まだコメントはありません" }));
  foldHelpIn(list);
}

async function load() {
  const j = await fresh("_affiliate/manual/comments.json");
  comments = (j && j.comments) || [];
  document.getElementById("updated").textContent = j && j.updated ? `最後に見つけたコメント: ${j.updated.slice(5, 16).replace("-", "/").replace("T", " ")}` : "まだコメントはありません";
  render();
}

// 「今すぐ確認」: Threads に新しいコメントを取りに行くワークフローを動かし、終わったら読み直す
document.getElementById("refresh").addEventListener("click", async ev => {
  const btn = ev.currentTarget, progress = document.getElementById("progress");
  if (!Key.get()) { progress.replaceChildren(needKeyBox()); return; }
  btn.disabled = true;
  const started = new Date(Date.now() - 5000).toISOString();
  try {
    await dispatch("affiliate_post.yml", { slot: "comments" });
  } catch (e) { progress.textContent = "⚠️ " + e.message; btn.disabled = false; return; }
  progress.textContent = "Threads にコメントを取りに行っています…（1〜2分）";
  for (let i = 0; i < 24; i++) {
    await new Promise(r => setTimeout(r, 7000));
    try {
      const runs = await gh(`/repos/${REPO}/actions/workflows/affiliate_post.yml/runs?event=workflow_dispatch&per_page=3`);
      const run = runs.workflow_runs.find(r => r.created_at >= started.slice(0, 19));
      if (run && run.status === "completed") {
        await load();
        progress.textContent = run.conclusion === "success" ? "✅ 確認しました" : "⚠️ うまく確認できませんでした。少し時間をおいてもう一度試してください";
        btn.disabled = false;
        return;
      }
    } catch (e) { /* 次の回でもう一度見る */ }
  }
  progress.textContent = "時間がかかっています。あとでページを開き直してください";
  btn.disabled = false;
});

document.getElementById("filter").addEventListener("click", ev => {
  onlyOpen = !onlyOpen;
  ev.currentTarget.setAttribute("aria-pressed", String(onlyOpen));
  ev.currentTarget.textContent = onlyOpen ? "未対応だけ" : "すべて表示";
  render();
});
load();
</script>
</body>
</html>
