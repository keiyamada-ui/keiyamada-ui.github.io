<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>今日の投稿</title>
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#FBF6EF">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top"><a class="back" href="./" aria-label="管理画面に戻る">‹</a><h1>📣 投稿</h1></header>
<div class="tabs" role="tablist">
  <button class="tab" id="t-day" role="tab">今日の投稿</button>
  <button class="tab" id="t-rewrite" role="tab">📝 書き直し帳</button>
  <button class="tab" id="t-insights" role="tab">📈 反響</button>
</div>
<main id="main"><p class="empty">読み込み中…</p></main>

<script src="app.js"></script>
<script>
// 投稿の枠（autopost.py と同じ）。時刻は毎日この幅の中でランダムに決まる（data/schedule.json）
const SLOTS = [
  { n: 1, window: "11:30〜13:00", end: 870, plan: "casual", label: "昼・短い投稿" },
  { n: 2, window: "17:00〜19:00", end: 1230, plan: "value", label: "夕方・役立つ投稿か PR 投稿" },
  { n: 3, window: "20:30〜22:00", end: 1410, plan: "buzz", label: "夜・短い投稿" },
];
const draftCache = {};
async function draft(name) {
  if (!(name in draftCache)) draftCache[name] = await raw("_affiliate/drafts/" + name);
  return draftCache[name];
}
async function postOf(entry) {
  const d = await draft(entry.draft);
  return d && d.posts ? d.posts[entry.post_index] : null;
}
let day = jstDate();
const main = document.getElementById("main");

// 「手で投稿した」を押してから、記録が反映されるまでの間の表示用（この端末だけ）
const MARKS = "kotori-marks";
const marks = {
  all() { try { return JSON.parse(localStorage.getItem(MARKS) || "{}"); } catch (e) { return {}; } },
  set(key, v) { const m = marks.all(); if (v) m[key] = v; else delete m[key]; try { localStorage.setItem(MARKS, JSON.stringify(m)); } catch (e) {} },
};

async function sendMark(name, i, undo, btn) {
  if (!Key.get()) {
    const box = btn.closest("section");
    if (!box.querySelector(".info")) box.prepend(needKeyBox());
    return;
  }
  btn.disabled = true;
  try {
    await gh(`/repos/${REPO}/actions/workflows/affiliate_mark.yml/dispatches`,
             { method: "POST", body: { ref: "main", inputs: { draft: name, index: String(i), undo: undo ? "true" : "false" } } });
    marks.set(`${name}:${i}`, undo ? "undo" : "mark");
    toast(undo ? "取り消しました（1〜2分で反映）" : "投稿済みにしました（1〜2分で反映）");
    showDay();
  } catch (e) { btn.disabled = false; toast(e.message); }
}

// イラストを外す（文章だけで投稿するようにする）
async function sendNoImage(name, i, btn) {
  if (!Key.get()) {
    const box = btn.closest("section");
    if (!box.querySelector(".info")) box.prepend(needKeyBox());
    return;
  }
  if (!confirm("この投稿のイラストを外して、文章だけで投稿しますか？")) return;
  btn.disabled = true;
  try {
    await dispatch("affiliate_mark.yml", { draft: name, index: String(i), noimage: "true" });
    btn.textContent = "外しました（1〜2分で反映）";
    toast("イラストを外しました");
  } catch (e) { btn.disabled = false; toast(e.message); }
}

// その日の投稿記録。古い下書きを手で投稿した記録は「投稿した日」のファイルに入るので、数日分まとめて読む
async function loadPosted(d) {
  const days = [...new Set([d, addDays(d, 1), addDays(d, 2), jstDate()])].filter(x => x <= jstDate());
  const lists = await Promise.all(days.map(x => raw("_affiliate/data/posted/" + x + ".json")));
  return lists.flatMap(x => x || []);
}

// ── AI に覚えてもらう（書き直し帳）──
async function sendRewrite(inputs, btn, done) {
  if (!Key.get()) { const box = btn.closest("section"); if (!box.querySelector(".info")) box.prepend(needKeyBox()); return false; }
  btn.disabled = true;
  try {
    await dispatch("affiliate_rewrite.yml", Object.assign({ mode: "add", kind: "", before: "", after: "", note: "", id: "" }, inputs));
    toast(done || "記録しました。明日の朝の下書きから使います");
    return true;
  } catch (e) { btn.disabled = false; toast(e.message); return false; }
}

function learnRow(post) {
  const before = [post.text, ...(post.thread_parts || [])].join("\n");
  const kind = post.type || "";
  const editor = el("div", { style: "display:none;margin-top:10px" });
  const area = el("textarea", { placeholder: "例）2枚3180円で送料無料！", rows: "3" });
  const memo = el("input", { type: "text", placeholder: "メモ（任意）例: 驚いたふりはいらない" });
  const save = el("button", { class: "btn primary", text: "記録する" });
  save.addEventListener("click", async () => {
    if (!area.value.trim()) { toast("書き直した文を入れてください"); return; }
    if (await sendRewrite({ type: "rewrite", kind, before, after: area.value.trim(), note: memo.value.trim() }, save)) {
      editor.replaceChildren(el("div", { class: "info", text: "✅ 覚えました。明日の朝の下書きから、この書き方をお手本にします" }));
    }
  });
  editor.append(el("label", { class: "field", text: "私ならこう書く" }), area, memo, el("div", { class: "actions" }, [save]));
  const edit = el("button", { class: "btn", text: "✏️ 私ならこう書く" });
  edit.addEventListener("click", () => { editor.style.display = editor.style.display === "none" ? "" : "none"; if (editor.style.display === "") area.focus(); });
  const good = el("button", { class: "btn", text: "👍", "aria-label": "良い" });
  good.addEventListener("click", () => sendRewrite({ type: "good", kind, before }, good, "👍 覚えました"));
  const bad = el("button", { class: "btn", text: "👎", "aria-label": "ダメ" });
  bad.addEventListener("click", () => {
    const why = prompt("どこがダメでしたか？（任意。空のままでもOK）", "") ;
    if (why === null) return;
    sendRewrite({ type: "bad", kind, before, note: why }, bad, "👎 覚えました。こう書かないようにします");
  });
  return [el("div", { class: "actions learn" }, [edit, good, bad]), editor];
}

// 自動で出す前の投稿を「出さない」にする（次の候補が出る）
async function sendSkip(name, i, btn) {
  if (!Key.get()) { const box = btn.closest("section"); if (!box.querySelector(".info")) box.prepend(needKeyBox()); return; }
  if (!confirm("この投稿は自動で出さないようにしますか？（代わりに次の候補が出ます）")) return;
  btn.disabled = true;
  try {
    await dispatch("affiliate_mark.yml", { draft: name, index: String(i), skip: "true" });
    btn.textContent = "⏭️ 出さないにしました（1〜2分で反映）";
    toast("この投稿は出さないようにしました");
  } catch (e) { btn.disabled = false; toast(e.message); }
}

function postBlock(post, extra = [], learn = true) {
  const parts = post.thread_parts || [];
  const all = [post.text, ...parts].join("\n\n――\n\n");
  let pic = null;
  if (post.image_url) {
    const img = el("img", { src: post.image_url, alt: "投稿に付けるイラスト", loading: "lazy",
      style: "display:block;width:100%;max-width:360px;border-radius:16px;margin-top:10px;background:var(--box)" });
    img.addEventListener("error", () => img.replaceWith(el("div", { class: "muted", text: "🖼️ イラスト（公開まで1〜2分かかります）" })));
    pic = el("div", {}, [el("div", { class: "muted", style: "margin-top:10px", text: "🖼️ この投稿にはイラストが付きます" }), img]);
  }
  return [el("div", { class: "text", text: all }), pic,
          post.reply_text ? el("div", { class: "muted", text: "返信（リンク）: " + post.reply_text }) : null,
          el("div", { class: "actions" }, [el("button", { class: "btn", text: "コピー", onclick: () => copy(post.text) }), ...extra]),
          ...(learn ? learnRow(post) : [])]
    .filter(Boolean);
}

async function showDay() {
  main.replaceChildren(el("p", { class: "empty", text: "読み込み中…" }));
  const [daily, buzz, casual, posted, schedule, skippedList] = await Promise.all([
    draft(day + ".json"), draft(day + "-buzz.json"), draft(day + "-casual.json"),
    loadPosted(day), raw("_affiliate/data/schedule.json"), raw("_affiliate/data/skipped.json")]);
  const plan = schedule && schedule.date === day ? schedule.slots : [];
  const skipped = new Set((skippedList || []).map(x => `${x.draft}:${x.post_index}`));
  const done = posted || [];
  // 記録が反映されたら、この端末の「反映待ち」を消す
  for (const [key, v] of Object.entries(marks.all())) {
    const [n, i] = [key.slice(0, key.lastIndexOf(":")), +key.slice(key.lastIndexOf(":") + 1)];
    const has = done.some(p => p.draft === n && p.post_index === i);
    if ((v === "mark" && has) || (v === "undo" && !has)) marks.set(key, null);
  }
  const today = jstDate();
  const now = new Date(Date.now() + 9 * 3600000);
  const nowMin = now.getUTCHours() * 60 + now.getUTCMinutes();
  const nodes = [];

  nodes.push(el("div", { class: "row between", style: "margin-bottom:12px" }, [
    el("button", { class: "btn", style: "flex:0 0 auto", text: "‹ 前の日", onclick: () => { day = addDays(day, -1); showDay(); } }),
    el("div", { class: "title", text: `${day.slice(5).replace("-", "/")}（${weekday(day)}）${day === today ? " 今日" : ""}` }),
    el("button", { class: "btn", style: "flex:0 0 auto", text: "次の日 ›", disabled: day >= today ? "" : null,
                  onclick: () => { day = addDays(day, 1); showDay(); } }),
  ]));

  // 投稿の枠（1日3回。たまに2回）
  const sched = el("section", { class: "card" }, [el("div", { class: "title", text: "投稿の予定と結果" })]);
  const box = el("div", { style: "margin-top:10px" });
  for (const s of SLOTS) {
    const hit = done.find(p => p.slot === s.n && p.date === day && !p.manual);
    const sp = plan.find(p => p.slot === s.n);
    const right = el("div");
    if (hit) {
      const post = await postOf(hit);
      right.append(el("div", { class: "row" }, [
        el("span", { class: "badge ok", text: "✅ 自動で投稿済み " + (hit.at ? hit.at.slice(11, 16) : "") }),
        el("span", { class: "badge" + (hit.kind === "pr" ? " pr" : ""), text: KIND[hit.kind] || hit.kind })]));
      if (hit.partial) right.append(el("div", { class: "muted", text: "⚠️ 途中までしか投稿できませんでした" }));
      if (post) right.append(...postBlock(post, hit.permalink ? [el("a", { class: "btn", href: hit.permalink, target: "_blank", rel: "noopener", text: "Threads で見る" })] : [], false));
    } else {
      const passed = day < today || (day === today && nowMin >= s.end);
      const rest = sp && sp.rest;
      right.append(el("div", { class: "row" }, [
        el("span", { class: "badge " + (passed || rest ? "gray" : ""), text: rest ? "💤 今日はお休み" : passed ? "— 投稿なし" : "⏳ 予定" + (sp ? `（${sp.time}ごろ）` : "") }),
        el("span", { class: "badge gray", text: s.label })]));
      if (s.n === 2) right.append(el("div", { class: "muted", text: "PR 投稿は2日おき。PR のない日は役立つ投稿を出します" }));
    }
    box.append(el("div", { class: "slot" }, [el("div", { class: "time", text: hit && hit.at ? hit.at.slice(11, 16) : sp ? sp.time : s.window }), right]));
  }
  const manual = done.filter(p => p.manual && p.date === day);
  if (manual.length) {
    box.append(el("div", { class: "slot" }, [el("div", { class: "time", text: "手動" }),
      el("div", {}, [el("span", { class: "badge", text: `✋ 手で投稿した記録 ${manual.length}件` }),
                     el("div", { class: "muted", text: "下の下書きの一覧に「手で投稿済み」と表示されます" })])]));
  }
  sched.append(box);
  nodes.push(sched);

  // その日の下書き
  const entryOf = (name, i) => done.find(p => p.draft === name && p.post_index === i);
  const pending = marks.all();
  const groups = [[buzz, day + "-buzz.json"], [casual, day + "-casual.json"], [daily, day + ".json"]];
  const any = groups.some(([d]) => d && d.posts && d.posts.length);
  nodes.push(el("h2", { text: "この日の下書き" }));
  if (!any) nodes.push(el("p", { class: "empty", text: "この日の下書きはありません（毎朝 5:15 ごろに作られます）" }));
  else if (day === today) nodes.push(el("p", { class: "muted", style: "margin:-4px 4px 10px", text: "まだ出ていない投稿で気に入らないものは「⏭️ これは出さない」で止められます（次の候補が出ます）。「✏️ 私ならこう書く」「👍👎」で教えると、AI が覚えます。" }));
  for (const [d, name] of groups) {
    if (!d || !d.posts) continue;
    const card = el("section", { class: "card" });
    if (d.topic) card.append(el("div", { class: "muted", text: "話題: " + d.topic }));
    if (d.title && name === day + ".json") card.append(el("div", { class: "title", text: d.title }));
    if (d.followup) card.append(el("div", { class: "info", text: `🔥 反響のあった投稿（いいね${d.followup.likes}件）の話題から選んだ商品です` }));
    if (d.chosen && d.chosen.name) card.append(el("div", { class: "muted" }, ["商品: ", el("a", { href: d.chosen.url, target: "_blank", rel: "noopener", text: d.chosen.name.slice(0, 50) })]));
    if (d.errors && d.errors.length) card.append(el("div", { class: "warn", text: "❌ 自動チェックのエラーがあるため投稿しません:\n" + d.errors.join("\n") }));
    d.posts.forEach((p, i) => {
      const e = entryOf(name, i);
      const wait = pending[`${name}:${i}`];
      let state, cls, extra = [];
      if (wait === "mark" && !e) [state, cls] = ["✋ 手で投稿済み（反映中）", "ok"];
      else if (wait === "undo" && e) [state, cls] = ["未投稿に戻しています（反映中）", "gray"];
      else if (e && e.manual) {
        [state, cls] = ["✋ 手で投稿済み", "ok"];
        extra = [el("button", { class: "btn", text: "取り消す", onclick: ev => sendMark(name, i, true, ev.currentTarget) })];
      } else if (e) {
        [state, cls] = ["✅ 自動で投稿済み " + (e.at ? e.at.slice(5, 10).replace("-", "/") + " " + e.at.slice(11, 16) : ""), "ok"];
        if (e.permalink) extra = [el("a", { class: "btn", href: e.permalink, target: "_blank", rel: "noopener", text: "Threads で見る" })];
      } else if (skipped.has(`${name}:${i}`)) {
        [state, cls] = ["⏭️ 出さない", "gray"];
      } else {
        [state, cls] = ["未投稿", "gray"];
        extra = [el("a", { class: "btn", target: "_blank", rel: "noopener", text: "Threads で開く",
                           href: "https://www.threads.com/intent/post?text=" + encodeURIComponent(p.text) }),
                 el("button", { class: "btn primary", text: "✋ 手で投稿した", onclick: ev => sendMark(name, i, false, ev.currentTarget) })];
        if (p.image_url) extra.push(el("button", { class: "btn danger", text: "🖼️ イラストを外す", onclick: ev => sendNoImage(name, i, ev.currentTarget) }));
        if (day === today) extra.push(el("button", { class: "btn danger", text: "⏭️ これは出さない", onclick: ev => sendSkip(name, i, ev.currentTarget) }));
      }
      card.append(el("div", { class: "row", style: "margin-top:12px" }, [
        el("span", { class: "badge" + (p.type === "pr" ? " pr" : ""), text: KIND[p.type] || p.type }),
        el("span", { class: "badge " + cls, text: state }),
        p.angle ? el("span", { class: "muted", text: p.angle }) : null]));
      card.append(...postBlock(p, extra));
    });
    nodes.push(card);
  }
  main.replaceChildren(...nodes);
}

async function showInsights() {
  main.replaceChildren(el("p", { class: "empty", text: "読み込み中…" }));
  const store = await raw("_affiliate/data/insights/latest.json");
  const rows = Object.values(store || {}).sort((a, b) => (b.date + b.draft).localeCompare(a.date + a.draft));
  if (!rows.length) {
    main.replaceChildren(el("p", { class: "empty", text: "まだ反響の記録はありません（投稿の翌朝から集まります）" }));
    return;
  }
  const likes = rows.map(r => r.metrics.likes || 0).sort((a, b) => a - b);
  const median = likes[Math.floor(likes.length / 2)];
  const nodes = [el("p", { class: "note", text: "毎朝、直近1週間の投稿の数字を取りに行きます。🔥 は、いいねがいつもの2倍以上（10件以上）の投稿です。" })];

  const byKind = {};
  for (const r of rows) (byKind[r.kind] = byKind[r.kind] || []).push(r.metrics);
  const avg = (ms, k) => (ms.reduce((s, m) => s + (m[k] || 0), 0) / ms.length);
  const sum = el("section", { class: "card" }, [el("div", { class: "title", text: "種類ごとの平均" })]);
  for (const [k, ms] of Object.entries(byKind)) {
    sum.append(el("div", { class: "row between", style: "margin-top:8px" }, [
      el("span", { text: `${KIND[k] || k}（${ms.length}件）` }),
      el("span", { class: "muted", text: `いいね ${avg(ms, "likes").toFixed(1)} ／ 表示 ${avg(ms, "views").toFixed(0)}` })]));
  }
  nodes.push(sum);

  for (const r of rows) {
    const m = r.metrics;
    const hot = (m.likes || 0) >= 10 && (m.likes || 0) >= 2 * median;
    const post = await postOf(r);
    // 返信の数から、自分で付けた返信（ツリーの続き・PR のリンク）を除く
    const own = r.own_replies ?? (post ? (post.thread_parts || []).length + (post.type === "pr" && post.reply_text ? 1 : 0) : 0);
    const replies = Math.max(0, (m.replies || 0) - own);
    nodes.push(el("section", { class: "card" }, [
      el("div", { class: "row between" }, [
        el("span", { class: "badge" + (r.kind === "pr" ? " pr" : ""), text: (hot ? "🔥 " : "") + (KIND[r.kind] || r.kind) }),
        el("span", { class: "muted", text: r.date })]),
      post ? el("div", { class: "text", text: post.text.slice(0, 140) + (post.text.length > 140 ? "…" : "") }) : null,
      el("div", { class: "stat" }, [
        el("div", {}, [el("b", { text: String(m.likes || 0) }), el("span", { text: "いいね" })]),
        el("div", {}, [el("b", { text: String(m.views || 0) }), el("span", { text: "表示" })]),
        el("div", {}, [el("b", { text: String(replies + (m.reposts || 0) + (m.quotes || 0)) }), el("span", { text: "返信・再投稿" })])]),
      r.permalink ? el("div", { class: "actions" }, [el("a", { class: "btn", href: r.permalink, target: "_blank", rel: "noopener", text: "Threads で見る" })]) : null,
    ]));
  }
  main.replaceChildren(...nodes);
  foldHelpIn(main);
}

// 📝 書き直し帳: 記録した書き直し・お手本・👍👎 の一覧。消すこともできる
async function showRewrite() {
  main.replaceChildren(el("p", { class: "empty", text: "読み込み中…" }));
  const list = (await fresh("_affiliate/data/rewrites.json")) || [];
  const TYPE = { rewrite: "✏️ 書き直し", sample: "🖊️ お手本", good: "👍 良い", bad: "👎 ダメ" };
  const KN = { buzz: "話題", casual: "つぶやき", value: "役立つ", pr: "PR", "": "" };
  const nodes = [el("p", { class: "note", text: "ここに記録したあなたの書き方を、AI が毎朝いちばん優先のお手本にします（新しいものから、書き直し10件・お手本5件・👍👎 各4件まで）。間違えて記録したものは消せます。" })];
  // お手本を書く（直す前の文がなくてもOK）
  const kindSel = el("select", { style: "font:inherit;font-size:16px;padding:10px;border-radius:12px;border:1.5px solid var(--line);background:var(--box);width:100%" },
    [["", "種類（任意）"], ["casual", "つぶやき"], ["value", "役立つ投稿"], ["pr", "PR 投稿"], ["buzz", "話題の投稿"]].map(([v, t]) => el("option", { value: v, text: t })));
  const area = el("textarea", { rows: "3", placeholder: "例）ロンT1枚1590円、2枚で3180円！送料も無料。" });
  const memo = el("input", { type: "text", placeholder: "メモ（任意）" });
  const save = el("button", { class: "btn primary", text: "お手本として記録する" });
  save.addEventListener("click", async () => {
    if (!area.value.trim()) { toast("文を入れてください"); return; }
    if (await sendRewrite({ type: "sample", kind: kindSel.value, after: area.value.trim(), note: memo.value.trim() }, save)) {
      area.value = ""; memo.value = ""; save.disabled = false;
    }
  });
  nodes.push(el("section", { class: "card" }, [el("div", { class: "title", text: "🖊️ 自分で書いたお手本を足す" }),
    el("div", { class: "muted", text: "「こういう商品ならこう書く」という文を、思いついたときに。" }),
    el("div", { style: "display:grid;gap:8px;margin-top:10px" }, [kindSel, area, memo]), el("div", { class: "actions" }, [save])]));
  if (!list.length) nodes.push(el("p", { class: "empty", text: "まだ記録はありません。「今日の投稿」の「✏️ 私ならこう書く」から記録できます" }));
  for (const e of [...list].reverse()) {
    const del = el("button", { class: "btn danger", text: "消す" });
    del.addEventListener("click", async () => {
      if (!confirm("この記録を消しますか？")) return;
      if (await sendRewrite({ mode: "delete", id: String(e.id) }, del, "消しました（1〜2分で反映）")) del.closest("section").remove();
    });
    nodes.push(el("section", { class: "card" }, [
      el("div", { class: "row between" }, [el("span", { class: "badge" + (e.type === "bad" ? " pr" : e.type === "good" ? " ok" : ""), text: TYPE[e.type] + (KN[e.kind] ? "・" + KN[e.kind] : "") }),
        el("span", { class: "muted", text: e.date })]),
      e.before ? el("div", { class: "text", style: e.type === "rewrite" ? "opacity:.6" : "", text: (e.type === "rewrite" ? "直す前: " : "") + e.before }) : null,
      e.after ? el("div", { class: "text", text: (e.type === "rewrite" ? "直した後: " : "") + e.after }) : null,
      e.note ? el("div", { class: "muted", style: "margin-top:6px", text: "メモ: " + e.note }) : null,
      el("div", { class: "actions" }, [del])]));
  }
  main.replaceChildren(...nodes);
  foldHelpIn(main);
}

setupTabs([["t-day", "day"], ["t-rewrite", "rewrite"], ["t-insights", "insights"]], name => {
  if (name !== "rewrite") Seen.mark(name === "day" ? "posts" : "insights");
  return ({ day: showDay, rewrite: showRewrite, insights: showInsights })[name]();
});
</script>
