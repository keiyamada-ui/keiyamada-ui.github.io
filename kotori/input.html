<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>入力・操作</title>
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#FBF6EF">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top"><a class="back" href="./" aria-label="管理画面に戻る">‹</a><h1>✏️ 入力・操作</h1></header>
<div class="tabs" role="tablist">
  <button class="tab" id="t-neta" role="tab">体験メモ</button>
  <button class="tab" id="t-recommend" role="tab">推し商品</button>
  <button class="tab" id="t-reference" role="tab">参考投稿</button>
  <button class="tab" id="t-actions" role="tab">操作</button>
</div>
<div id="keybox"></div>
<main id="main"></main>

<script src="app.js"></script>
<script>
const main = document.getElementById("main");
const NO = "_No response_";
const field = (label, input, hint) => [el("label", { class: "field" }, [label, hint ? el("small", { text: "　" + hint }) : null]), input];
const v = x => (x || "").trim() || NO;

async function createIssue(title, body, labels, btn, done) {
  if (!Key.get()) { toast("送るには合い鍵が必要です（上の案内から登録してください）"); window.scrollTo(0, 0); return false; }
  btn.disabled = true;
  try {
    await gh(`/repos/${REPO}/issues`, { method: "POST", body: { title, body, labels } });
    toast(done);
    return true;
  } catch (e) { toast(e.message); return false; }
  finally { btn.disabled = false; }
}

// 📝 体験メモ: 本人に実際にあったこと・使ってみた感想。投稿に本人の体験として入る（experiences.py）
async function sendExp(inputs, btn, done) {
  if (!Key.get()) { toast("送るには合い鍵が必要です（上の案内から登録してください）"); window.scrollTo(0, 0); return false; }
  btn.disabled = true;
  try {
    await dispatch("affiliate_experience.yml", Object.assign({ mode: "add", text: "", item: "", id: "" }, inputs));
    toast(done); return true;
  } catch (e) { toast(e.message); return false; }
  finally { btn.disabled = false; }
}

async function showNeta() {
  let editing = null;
  const text = el("textarea", { rows: "4", placeholder: "例）中2の水筒を2wayのに替えたら、パッキンが1個少なくて洗うのがすごく楽になった" });
  const item = el("input", { type: "text", placeholder: "使っている物（分かれば）例）水筒 2way 800ml" });
  const btn = el("button", { class: "btn primary", text: "体験メモに入れる" });
  const cancel = el("button", { class: "btn", text: "やめる", style: "display:none" });
  const head = el("div", { class: "title", text: "📝 体験メモ" });
  const reset = () => { editing = null; text.value = ""; item.value = ""; btn.textContent = "体験メモに入れる"; cancel.style.display = "none"; head.textContent = "📝 体験メモ"; };
  cancel.addEventListener("click", reset);
  btn.addEventListener("click", async () => {
    const t = text.value.trim();
    if (!t) { toast("あったこと・感想を書いてください"); return; }
    const ok = editing
      ? await sendExp({ mode: "edit", id: String(editing), text: t, item: item.value.trim() }, btn, "直しました（1〜2分で反映）")
      : await sendExp({ text: t, item: item.value.trim() }, btn, "入れました。翌朝の投稿から使います");
    if (ok) reset();
  });
  const form = el("section", { class: "card" }, [head,
    el("p", { class: "note", style: "margin-top:6px", text: "実際にあったこと・使ってみた感想を、一言でOK。PR 投稿・役立つ投稿・つぶやきに、話題が合うときだけ「あなたの体験」として入ります。AI はここに書いたこと以外の体験を足しません。" }),
    el("ul", { class: "note", style: "margin:4px 0 8px;padding-left:1.2em" }, [
      el("li", { text: "「使っている物」を書くと、楽天で探して PR 投稿の候補にします（一度だけ）" }),
      el("li", { text: "同じメモは2週間あけて3回まで使います" }),
      el("li", { text: "子どもの名前・学校名・地域は書かないでください（書いても投稿には出しません）" })]),
    el("div", { style: "display:grid;gap:8px" }, [text, item]), el("div", { class: "actions" }, [btn, cancel])]);
  main.replaceChildren(form, el("p", { class: "empty", text: "読み込み中…" }));
  const list = (await fresh("_affiliate/data/experiences.json")) || [];
  const nodes = [form];
  if (!list.length) nodes.push(el("p", { class: "empty", text: "まだメモはありません" }));
  for (const e of [...list].reverse()) {
    const uses = (e.uses || []).length;
    const fix = el("button", { class: "btn", text: "直す" });
    fix.addEventListener("click", () => {
      editing = e.id; text.value = e.text; item.value = e.item || "";
      btn.textContent = "直して保存する"; cancel.style.display = ""; head.textContent = `✏️ ${e.id}番のメモを直す`;
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
    const del = el("button", { class: "btn danger", text: "消す" });
    del.addEventListener("click", async () => {
      if (!confirm("このメモを消しますか？")) return;
      if (await sendExp({ mode: "delete", id: String(e.id) }, del, "消しました（1〜2分で反映）")) del.closest("section").remove();
    });
    nodes.push(el("section", { class: "card" }, [
      el("div", { class: "row between" }, [
        el("span", { class: "badge" + (uses ? " ok" : ""), text: uses ? `使った回数 ${uses}/3` : "まだ使っていない" }),
        el("span", { class: "muted", text: e.date.slice(5).replace("-", "/") })]),
      el("p", { style: "margin:8px 0 4px;white-space:pre-wrap", text: e.text }),
      e.item ? el("div", { class: "muted", text: "使っている物: " + e.item + (e.themed ? "（PR の候補に入れました）" : "（翌朝、楽天で探します）") }) : null,
      el("div", { class: "actions" }, [fix, del])]));
  }
  main.replaceChildren(...nodes);
}

function showRecommend() {
  const url = el("input", { type: "url", placeholder: "https://item.rakuten.co.jp/..." });
  const isbn = el("input", { type: "text", inputmode: "numeric", placeholder: "9784..." });
  const memo = el("textarea", { placeholder: "良いと思った点・使ってみた感想など（事実として投稿に使われます）" });
  const used = el("input", { type: "checkbox", id: "used" });
  const btn = el("button", { class: "btn primary", text: "この商品の下書きを作る" });
  btn.addEventListener("click", async () => {
    if (!url.value.trim() && !isbn.value.trim()) { toast("商品のURLか ISBN を入れてください"); return; }
    const body = [`### 商品のURL\n\n${v(url.value)}`, `### ISBN（本の場合）\n\n${v(isbn.value)}`,
                  `### ひとことメモ\n\n${v(memo.value)}`,
                  `### 実際に使いましたか？\n\n- [${used.checked ? "X" : " "}] 使ったことがある（体験談として書いてOK）`].join("\n\n");
    if (await createIssue("[推し商品] " + (url.value.trim() || isbn.value.trim()).slice(0, 40), body, [], btn,
                          "受け付けました。数分で下書きができ、夕方（17:40ごろ）の PR 投稿の枠で優先して投稿します")) {
      url.value = isbn.value = memo.value = ""; used.checked = false;
    }
  });
  main.replaceChildren(el("section", { class: "card" }, [
    el("div", { class: "title", text: "🛒 この商品を紹介したい" }),
    el("p", { class: "note", style: "margin-top:6px", text: "楽天市場・楽天トラベルの商品ページの URL（楽天アプリの共有リンクも可）。本は URL の代わりに ISBN でもOK。" }),
    ...field("商品のURL", url), ...field("ISBN", isbn, "本の場合"), ...field("ひとことメモ", memo, "任意"),
    el("label", { class: "check", for: "used" }, [used, "実際に使ったことがある（体験談として書いてOK）"]),
    el("div", { class: "actions" }, [btn])]));
}

// スクショを小さくして（横720px・JPEG）base64 にする
function shrink(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 720 / img.width);
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);
      g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      resolve(c.toDataURL("image/jpeg", 0.72).split(",")[1]);
    };
    img.onerror = () => reject(new Error("画像を読み込めませんでした"));
    img.src = URL.createObjectURL(file);
  });
}

function showReference() {
  const url = el("input", { type: "url", placeholder: "https://www.threads.com/@.../post/..." });
  const text = el("textarea", { placeholder: "伸びている投稿の文章を貼り付け（ツリーは続けてOK）" });
  const likes = el("input", { type: "number", inputmode: "numeric", placeholder: "120" });
  const memo = el("textarea", { placeholder: "どこが良いと思ったか（任意）" });
  // 種類: 伸びている投稿（型を学ぶ）／考え方・コツ（ことり 用のルールにする）
  let kind = "post";
  const kPost = el("button", { class: "btn primary", text: "🔥 伸びている投稿" });
  const kTips = el("button", { class: "btn", text: "💡 考え方・コツ" });
  const kindNote = el("p", { class: "muted", style: "margin-top:6px" });
  const setKind = k => {
    kind = k;
    kPost.className = "btn" + (k === "post" ? " primary" : ""); kTips.className = "btn" + (k === "tips" ? " primary" : "");
    kindNote.textContent = k === "post"
      ? "実際に伸びている投稿から、書き出しや構成の「型」を学びます。コメント欄のスクショも入れると、読者がどこに反応したか・何を知りたがっているかも分析します。"
      : "「バズる投稿の作り方」などの解説（投稿・記事・メモ）から、ことり で使える具体的なルールと例文を作ります。毎日の文章作りすべてに使われます。";
    text.placeholder = k === "post" ? "伸びている投稿の文章を貼り付け（ツリーは続けてOK）" : "考え方・コツの内容を貼り付け（解説の投稿・記事の要点・自分のメモなど）";
  };
  kPost.addEventListener("click", () => setKind("post"));
  kTips.addEventListener("click", () => setKind("tips"));
  setKind("post");
  const shots = el("input", { type: "file", accept: "image/*", multiple: "" , style: "display:none" });
  const pick = el("button", { class: "btn", text: "📷 スクショを選ぶ（6枚まで・コメント欄もOK）" });
  const previews = el("div", { class: "row", style: "margin-top:8px;gap:8px" });
  let files = [];
  pick.addEventListener("click", () => shots.click());
  shots.addEventListener("change", () => {
    files = [...shots.files].slice(0, 6);
    previews.replaceChildren(...files.map(f => el("img", { src: URL.createObjectURL(f), alt: "スクショ",
      style: "width:84px;height:150px;object-fit:cover;border-radius:12px;border:1px solid var(--line)" })));
    if (shots.files.length > 6) toast("スクショは6枚までです");
  });
  const status = el("div", { class: "muted", style: "margin-top:6px" });
  const btn = el("button", { class: "btn primary", text: "型を分析してもらう" });
  btn.addEventListener("click", async () => {
    if (!text.value.trim() && !files.length) { toast("投稿の本文を貼り付けるか、スクショを選んでください"); return; }
    if (!Key.get()) { toast("送るには合い鍵が必要です（上の案内から登録してください）"); window.scrollTo(0, 0); return; }
    btn.disabled = true;
    try {
      // スクショは Issue のコメントに分けて送り、分析が終わったら自動で消す（公開の場所に残さない）
      status.textContent = files.length ? "スクショを小さくしています…" : "";
      const datas = [];
      for (const f of files) datas.push(await shrink(f));
      const body = [`### 種類\n\n${kind === "tips" ? "考え方・コツ" : "伸びている投稿"}`, `### 投稿のURL\n\n${v(url.value)}`,
                    `### 投稿の本文\n\n${text.value.trim() || "（スクショから読み取ってください）"}`,
                    `### いいねの数\n\n${v(likes.value)}`, `### ひとことメモ\n\n${v(memo.value)}`,
                    datas.length ? `<!-- kotori-shots ${datas.length} -->` : ""].join("\n\n");
      const title = "[参考投稿] " + (kind === "tips" ? "💡" : "") + (text.value.trim().slice(0, 24) || `スクショ ${jstDate().slice(5).replace("-", "/")}`);
      const issue = await gh(`/repos/${REPO}/issues`, { method: "POST", body: { title, body } });
      const SIZE = 60000;
      for (let k = 0; k < datas.length; k++) {
        const parts = Math.ceil(datas[k].length / SIZE);
        for (let p = 0; p < parts; p++) {
          status.textContent = `スクショを送っています…（${k + 1}枚目 ${p + 1}/${parts}）`;
          await gh(`/repos/${REPO}/issues/${issue.number}/comments`, { method: "POST",
            body: { body: `<!-- kotori-shot ${k + 1}:${p + 1}/${parts} -->\n` + datas[k].slice(p * SIZE, (p + 1) * SIZE) } });
        }
      }
      status.textContent = "";
      toast("受け付けました。数分で分析が終わり、勝ちパターンに入ります");
      url.value = text.value = likes.value = memo.value = ""; files = []; shots.value = ""; previews.replaceChildren();
    } catch (e) { toast(e.message); status.textContent = "⚠️ " + e.message; }
    btn.disabled = false;
  });
  main.replaceChildren(el("section", { class: "card" }, [
    el("div", { class: "title", text: "⭐ 参考になる投稿を登録" }),
    el("p", { class: "note", style: "margin-top:6px", text: "伸びている投稿や、伸ばし方の考え方・コツをスクショか文章で送ると、AI が ことり の投稿に使える形に直して、毎朝の下書きに活かします（文章はまねしません）。" }),
    el("label", { class: "field", text: "何を送りますか？" }), el("div", { class: "actions", style: "margin-top:0" }, [kPost, kTips]), kindNote,
    el("label", { class: "field", text: "スクショ（いちばん簡単）" }), pick, shots, previews,
    el("p", { class: "muted", style: "margin-top:6px", text: "文字が読めるように撮ってください（伸びている投稿なら、いいね数も）。スクショは分析が終わると自動で消えます。" }),
    ...field("本文・内容", text, "スクショがあれば不要"), ...field("投稿のURL", url, "任意"), ...field("いいねの数", likes, "任意"),
    ...field("ひとことメモ", memo, "任意"),
    el("div", { class: "actions" }, [btn]), status,
    el("div", { class: "actions" }, [el("a", { class: "btn", href: "notices.html#patterns", text: "🏆 勝ちパターン一覧を見る" })])]));
}

async function showActions() {
  const state = el("span", { class: "badge gray", text: "確認中…" });
  const toggle = el("button", { class: "btn", text: "…", disabled: "" });
  let active = null;
  const refresh = async () => {
    try {
      active = (await gh(`/repos/${REPO}/actions/workflows/affiliate_post.yml`)).state === "active";
      state.className = "badge " + (active ? "ok" : "ng");
      state.textContent = active ? "▶️ 動いています" : "⏸ 止まっています";
      toggle.textContent = active ? "⏸ 自動投稿を止める" : "▶️ 自動投稿を再開する";
      toggle.className = "btn " + (active ? "danger" : "primary");
      toggle.disabled = false;
    } catch (e) { state.textContent = "確認できません"; }
  };
  toggle.addEventListener("click", async () => {
    if (!Key.get()) { toast("操作には合い鍵が必要です（上の案内から登録してください）"); window.scrollTo(0, 0); return; }
    if (active && !confirm("自動投稿を止めますか？（再開するまで Threads に投稿されません）")) return;
    toggle.disabled = true;
    try {
      await gh(`/repos/${REPO}/actions/workflows/affiliate_post.yml/${active ? "disable" : "enable"}`, { method: "PUT" });
      toast(active ? "止めました" : "再開しました");
    } catch (e) { toast(e.message); }
    refresh();
  });
  const dispatch = (file, inputs, msg, ask) => async ev => {
    if (!Key.get()) { toast("操作には合い鍵が必要です（上の案内から登録してください）"); window.scrollTo(0, 0); return; }
    if (ask && !confirm(ask)) return;
    const b = ev.currentTarget; b.disabled = true;
    try {
      await gh(`/repos/${REPO}/actions/workflows/${file}/dispatches`, { method: "POST", body: { ref: "main", inputs } });
      toast(msg);
    } catch (e) { toast(e.message); }
    b.disabled = false;
  };
  main.replaceChildren(
    el("section", { class: "card" }, [
      el("div", { class: "row between" }, [el("div", { class: "title", text: "📣 自動投稿" }), state]),
      el("p", { class: "note", style: "margin-top:6px", text: "止めている間は Threads に投稿しません（下書きは毎朝作られます）。" }),
      el("div", { class: "actions" }, [toggle])]),
    el("section", { class: "card" }, [
      el("div", { class: "title", text: "▶️ 今すぐ下書きを作る" }),
      el("p", { class: "note", style: "margin-top:6px", text: "毎朝 5:15 の下書き作りを、今すぐもう一度行います。今日の下書きは作り直されます（すでに投稿した分は二重に出ません）。2〜5分かかります。" }),
      el("div", { class: "actions" }, [el("button", { class: "btn primary", text: "下書きを作る",
        onclick: dispatch("affiliate_drafts.yml", { mode: "drafts" }, "始めました。2〜5分後に「今日の投稿」で確認できます", "今日の下書きを作り直しますか？") })])]),
    el("section", { class: "card" }, [
      el("div", { class: "title", text: "🔌 接続確認" }),
      el("p", { class: "note", style: "margin-top:6px", text: "Threads・楽天・AI につながるか確かめます。結果は「お知らせ・状況」の動作状況で見られます。" }),
      el("div", { class: "actions" }, [
        el("button", { class: "btn", text: "Threads", onclick: dispatch("affiliate_post.yml", { slot: "check" }, "確認を始めました") }),
        el("button", { class: "btn", text: "楽天・AI", onclick: dispatch("affiliate_drafts.yml", { mode: "check-api" }, "確認を始めました") })])]),
  );
  refresh();
}

if (!Key.get()) document.getElementById("keybox").append(needKeyBox());
setupTabs([["t-neta", "neta"], ["t-recommend", "recommend"], ["t-reference", "reference"], ["t-actions", "actions"]],
  name => ({ neta: showNeta, recommend: showRecommend, reference: showReference, actions: showActions })[name]());
</script>
</body>
</html>
