<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>手動投稿ストック・楽天ROOM</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png?v=3">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#FBF6EF">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
  :root {
    --bg: #FBF6EF; --card: #FFFFFF; --text: #4A4453; --sub: #8F8698; --line: #EFE5D8;
    --accent: #FFC75A; --accent-bg: #FFF4D9; --pr: #E86F7E; --pr-bg: #FFEAEE; --ok: #4AA57A; --box: #F8F2EA;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: "Zen Maru Gothic", -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
         padding: max(12px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom)); }
  header { display: flex; align-items: center; gap: 10px; margin: 6px 0 10px; }
  header a.back { color: var(--sub); text-decoration: none; font-size: 22px; padding: 4px 6px 4px 0; }
  h1 { font-size: 19px; margin: 0; }
  .note { color: var(--sub); font-size: 12px; line-height: 1.5; margin: 0 0 12px; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--box); border-radius: 12px; padding: 4px; margin-bottom: 12px; }
  .tab { border: 0; background: transparent; color: var(--sub); border-radius: 9px; padding: 9px 0; font-size: 14px; font-weight: 700; font-family: inherit; }
  .tab[aria-selected="true"] { background: var(--card); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .room { display: flex; gap: 10px; }
  .room img { width: 72px; height: 72px; border-radius: 10px; object-fit: cover; background: var(--box); flex: none; }
  .room-name { font-size: 13px; font-weight: 700; line-height: 1.4; overflow-wrap: anywhere; }
  .count { color: var(--sub); font-size: 12px; margin: -4px 0 10px; }
  .bar { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 999px;
          padding: 7px 12px; font-size: 13px; font-family: inherit; }
  .chip[aria-pressed="true"] { background: var(--accent-bg); border-color: var(--accent); font-weight: 700; }
  .set { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 16px; }
  .set-head { display: flex; gap: 10px; align-items: flex-start; }
  .set-head img { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; background: var(--box); flex: none; }
  .date { color: var(--sub); font-size: 12px; }
  .theme { font-weight: 700; font-size: 15px; margin: 2px 0; }
  .item { font-size: 12px; color: var(--sub); line-height: 1.4; overflow-wrap: anywhere; }
  .item a { color: inherit; }
  .warn { background: var(--pr-bg); color: var(--pr); border-radius: 10px; padding: 8px 10px; font-size: 12px; margin-top: 10px; line-height: 1.5; }
  .post { border-top: 1px dashed var(--line); margin-top: 12px; padding-top: 12px; }
  .post.used { opacity: 0.45; }
  .post-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .badge { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--accent-bg); color: var(--text); }
  .badge.pr { background: var(--pr-bg); color: var(--pr); }
  .angle { font-size: 12px; color: var(--sub); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .label { font-size: 11px; color: var(--sub); margin: 8px 0 4px; }
  .text { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--box); border-radius: 10px; padding: 10px; font-size: 14px; line-height: 1.6; }
  .actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  button.act, a.act { flex: 1 1 auto; min-height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--card);
                      color: var(--text); font-size: 13px; font-weight: 600; font-family: inherit; text-decoration: none;
                      display: inline-flex; align-items: center; justify-content: center; padding: 0 10px; }
  button.act.primary { background: var(--accent); border-color: var(--accent); color: #4A3A12; }
  button.act.done { color: var(--ok); border-color: var(--ok); }
  .who { font-size: 12px; color: var(--sub); margin-bottom: 4px; overflow-wrap: anywhere; }
  .quote { font-size: 12px; color: var(--sub); border-left: 3px solid var(--line); padding-left: 8px; margin: 8px 0; line-height: 1.5; overflow-wrap: anywhere; }
  .badge.like { background: #FCE4EC; color: #C2185B; }
  .badge.ignore { background: var(--box); color: var(--sub); }
  .empty { text-align: center; color: var(--sub); padding: 40px 0; font-size: 14px; }
  #toast { position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); transform: translateX(-50%);
           background: #4A4453; color: #fff; padding: 10px 16px; border-radius: 999px; font-size: 14px;
           opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <a class="back" href="./" aria-label="管理画面に戻る">‹</a>
  <h1>✋ 手動投稿ストック・ROOM</h1>
</header>
<p class="note">Threads は自動投稿とは別のテーマ・商品で、ROOM は毎朝6件ほど（セール前は多め）たまっていきます。コピーして自分の手で投稿し、終わったら「使った」を押してください（この端末に記録されます）。PR 投稿は、リンクを本文ではなく自分の投稿への返信に貼ります。</p>
<div class="tabs" role="tablist">
  <button class="tab" id="t-threads" role="tab" aria-selected="true">🧵 Threads</button>
  <button class="tab" id="t-room" role="tab" aria-selected="false">🛍️ 楽天ROOM</button>
</div>
<div class="bar">
  <button class="chip" id="f-unused" aria-pressed="true">未使用だけ</button>
  <button class="chip" id="f-value" aria-pressed="false">リンクなしだけ</button>
  <button class="chip" id="f-pr" aria-pressed="false">PR だけ</button>
</div>
<main id="list"><p class="empty">読み込み中…</p></main>
<div id="toast"></div>

<script>
if (location.hash === "#comments") location.replace("comments.html");
const SRC = new URLSearchParams(location.search).get("src") ||
  "https://raw.githubusercontent.com/keiyamada-ui/keiyamada-ui.github.io/main/_affiliate/manual/index.json";
const ROOM_SRC = new URLSearchParams(location.search).get("room") ||
  "https://raw.githubusercontent.com/keiyamada-ui/keiyamada-ui.github.io/main/_affiliate/manual/room.json";
let tab = "threads";
let room = [];
const KEY = "kotori-used-v1";
const store = {
  get() { try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { return {}; } },
  set(v) { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch (e) {} },
};
let used = store.get();
let filters = { unused: true, value: false, pr: false };
let data = { sets: [] };

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove("show"), 1400);
}

async function copy(text) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } finally { ta.remove(); }
  }
  toast("コピーしました");
}

function el(tag, attrs = {}, children = []) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(children)) if (c) n.append(c);
  return n;
}

function textBlock(label, text, withOpen) {
  const actions = [el("button", { class: "act primary", text: "コピー", onclick: () => copy(text) })];
  if (withOpen) {
    actions.push(el("a", { class: "act", text: "Threads で開く", target: "_blank", rel: "noopener",
      href: "https://www.threads.com/intent/post?text=" + encodeURIComponent(text) }));
  }
  return [el("div", { class: "label", text: label }), el("div", { class: "text", text }),
          el("div", { class: "actions" }, actions)];
}

// 楽天市場の商品は、ROOM の投稿画面を商品を選んだ状態で開ける（商品コード「お店:商品」を使う）。
// 本は ROOM の投稿画面を直接開けないので、書名をコピーして ROOM アプリの「商品キーワード検索から投稿」で探す
function roomButtons(r) {
  const ichiba = r.source === "ichiba" && String(r.id || "").includes(":");
  if (ichiba) {
    const url = "https://room.rakuten.co.jp/mix?itemcode=" + encodeURIComponent(r.id) + "&scid=we_room_upc60";
    return [el("button", { class: "act primary", text: "① コメントをコピーして ROOM で開く", onclick: () => {
      copy(r.comment);  // 待たずに開く（待つとスマホのブラウザに新しい画面を止められることがある）
      window.open(url, "_blank", "noopener");
    } }),
      el("a", { class: "act", text: "商品ページ", href: r.url, target: "_blank", rel: "noopener" })];
  }
  return [el("button", { class: "act primary", text: "① 書名をコピー", onclick: () => copy(r.name) }),
          el("button", { class: "act primary", text: "② コメントをコピー", onclick: () => copy(r.comment) }),
          el("a", { class: "act", text: "商品ページ", href: r.url, target: "_blank", rel: "noopener" })];
}

function renderRoom() {
  const list = document.getElementById("list");
  list.replaceChildren();
  const items = room.filter(r => !filters.unused || !used["room:" + r.key]);
  const left = room.filter(r => !used["room:" + r.key]).length;
  list.append(el("p", { class: "count", text: `未投稿 ${left} 件 ／ 楽天市場の商品:「コメントをコピーして ROOM で開く」→ コメント欄に貼って投稿。本: ROOM アプリの投稿ボタン →「商品キーワード検索から投稿」で書名を貼って探す → コメントを貼って投稿` }));
  for (const r of items) {
    const key = "room:" + r.key;
    const done = !!used[key];
    const card = el("section", { class: "set" + (done ? " used" : "") }, [
      el("div", { class: "room" }, [
        r.image ? el("img", { src: r.image, alt: "", loading: "lazy" }) : null,
        el("div", {}, [
          el("div", { class: "date", text: r.date + (r.is_hidden_gem ? "　💎発掘枠" : "") }),
          el("div", { class: "room-name", text: (r.name || "").slice(0, 70) }),
          el("div", { class: "item", text: r.price ? `${Number(r.price).toLocaleString()}円・★${r.review_average}（${r.review_count}件）` : "" }),
        ]),
      ]),
      el("div", { class: "label", text: "ROOM 用コメント" }),
      el("div", { class: "text", text: r.comment }),
      el("div", { class: "actions" }, roomButtons(r)),
    ]);
    const doneBtn = el("button", { class: "act" + (done ? " done" : ""), text: done ? "✓ 投稿した（戻す）" : "投稿した" });
    doneBtn.addEventListener("click", () => {
      if (used[key]) delete used[key]; else used[key] = new Date().toISOString();
      store.set(used); renderRoom();
      if (used[key]) toast("投稿済みにしました");
    });
    card.append(el("div", { class: "actions" }, [doneBtn]));
    list.append(card);
  }
  if (!items.length) list.append(el("p", { class: "empty", text: room.length ? "今日の分はすべて投稿済みです 🎉" : "まだありません（毎朝たまっていきます）" }));
}

function show() {
  const single = tab !== "threads";
  document.getElementById("f-value").style.display = single ? "none" : "";
  document.getElementById("f-pr").style.display = single ? "none" : "";
  document.getElementById("f-unused").textContent = { threads: "未使用だけ", room: "未投稿だけ" }[tab];
  if (tab === "room") renderRoom(); else render();
}

function render() {
  const list = document.getElementById("list");
  list.replaceChildren();
  let shown = 0;
  for (const set of data.sets) {
    const posts = set.posts.map((p, i) => ({ ...p, key: `${set.id}:${i}` })).filter(p =>
      (!filters.unused || !used[p.key]) && (!filters.value || p.type === "value") && (!filters.pr || p.type === "pr"));
    if (!posts.length) continue;
    shown += posts.length;
    const item = set.item || {};
    const head = el("div", { class: "set-head" }, [
      item.image ? el("img", { src: item.image, alt: "", loading: "lazy" }) : null,
      el("div", {}, [
        el("div", { class: "date", text: set.date + (item.is_hidden_gem ? "　💎発掘枠" : "") }),
        el("div", { class: "theme", text: set.theme }),
        el("div", { class: "item" }, [
          item.name ? el("a", { href: item.url, target: "_blank", rel: "noopener", text: item.name.slice(0, 60) }) : null,
          item.price ? ` ／ ${Number(item.price).toLocaleString()}円・★${item.review_average}（${item.review_count}件）` : "",
        ]),
      ]),
    ]);
    const card = el("section", { class: "set" }, [head]);
    const notes = [...(set.errors || []).map(e => "❌ " + e), ...(set.questions || []).map(q => "🙋 " + q)];
    if (notes.length) card.append(el("div", { class: "warn", text: notes.join("\n") }));

    for (const p of posts) {
      const isPr = p.type === "pr";
      const parts = p.thread_parts || [];
      const box = el("div", { class: "post" + (used[p.key] ? " used" : "") }, [
        el("div", { class: "post-head" }, [
          el("span", { class: "badge" + (isPr ? " pr" : ""), text: isPr ? "PR・リンクあり" : "リンクなし" }),
          el("span", { class: "angle", text: p.angle }),
        ]),
      ]);
      box.append(...textBlock(parts.length ? `本文（ツリー 1/${parts.length + 1}）` : "本文", p.text, true));
      parts.forEach((t, i) => box.append(...textBlock(`ツリー ${i + 2}/${parts.length + 1}（自分の投稿への返信として）`, t, false)));
      if (isPr && p.reply_text) box.append(...textBlock("返信（自分の投稿への返信に貼る・リンク入り）", p.reply_text, false));
      if (isPr && set.room_comment) box.append(...textBlock("楽天ROOM 用コメント（この商品は「楽天ROOM」タブには出ません）", set.room_comment, false));
      const doneBtn = el("button", { class: "act" + (used[p.key] ? " done" : ""), text: used[p.key] ? "✓ 使った（戻す）" : "使った" });
      doneBtn.addEventListener("click", () => {
        if (used[p.key]) delete used[p.key]; else used[p.key] = new Date().toISOString();
        store.set(used); render();
        if (used[p.key]) toast("使った印を付けました");
      });
      box.append(el("div", { class: "actions" }, [doneBtn]));
      card.append(box);
    }
    list.append(card);
  }
  if (!shown) list.append(el("p", { class: "empty", text: data.sets.length ? "条件に合う投稿はありません" : "まだストックがありません（毎朝たまっていきます）" }));
}

function toggle(id, name, others = []) {
  document.getElementById(id).addEventListener("click", e => {
    filters[name] = !filters[name];
    for (const o of others) { if (filters[name]) { filters[o] = false; document.getElementById("f-" + o).setAttribute("aria-pressed", "false"); } }
    e.currentTarget.setAttribute("aria-pressed", String(filters[name]));
    show();
  });
}
toggle("f-unused", "unused");
toggle("f-value", "value", ["pr"]);
toggle("f-pr", "pr", ["value"]);

const TABS = [["t-threads", "threads"], ["t-room", "room"]];
for (const [id, name] of TABS) {
  document.getElementById(id).addEventListener("click", () => {
    tab = name;
    for (const [i, n] of TABS) document.getElementById(i).setAttribute("aria-selected", String(n === name));
    try { localStorage.setItem("kotori-tab", name); } catch (e) {}
    show();
  });
}
{
  let start = location.hash.slice(1);
  if (!start) { try { start = localStorage.getItem("kotori-tab") || ""; } catch (e) {} }
  const found = TABS.find(([, n]) => n === start);
  if (found && start !== "threads") document.getElementById(found[0]).click();
}



fetch(ROOM_SRC + (ROOM_SRC.includes("?") ? "&" : "?") + "t=" + Date.now())
  .then(r => r.ok ? r.json() : [])
  .then(j => { room = Array.isArray(j) ? j : []; if (tab === "room") show(); })
  .catch(() => {});

fetch(SRC + (SRC.includes("?") ? "&" : "?") + "t=" + Date.now())
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(j => { data = j; if (tab === "threads") show(); })
  .catch(() => {
    document.getElementById("list").replaceChildren(
      el("p", { class: "empty", text: "まだストックがありません（毎朝たまっていきます）" }));
  });
</script>
</body>
</html>
