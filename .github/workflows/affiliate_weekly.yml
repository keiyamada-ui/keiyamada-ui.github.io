name: ことり 週のふり返り

on:
  schedule:
    # 毎週日曜 日本時間 20:51 ごろ（GitHub は UTC なので 9 時間引く）
    - cron: '51 11 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: affiliate-main
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KOTORI_STORE_KEY: ${{ secrets.KOTORI_STORE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r _affiliate/requirements.txt
      - name: ふり返りを作って通知する
        run: python _affiliate/weekly.py
      - name: 保存する
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _affiliate/data/weekly
          git commit -m "週のふり返り" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
