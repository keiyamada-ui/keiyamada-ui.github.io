name: ことり 自動投稿

on:
  schedule:
    # 投稿の予定: 日本時間 7:40 集客投稿・10:10 つぶやき・12:20 役立つ投稿・15:40 つぶやき・20:10 PR 投稿。
    # GitHub の定期実行は数時間遅れることがあるため、日本時間 6:00〜23:40 に20分おきに起動し、
    # 「時刻を過ぎて、まだ出していない枠」があれば出す（何もないときはすぐ終わる）。GitHub は UTC なので 9 時間引く
    - cron: '*/20 21-23,0-14 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'auto = 出し損ねた枠があれば出す / 1〜5 = その枠を今すぐ / comments = コメントだけ確認 / check = Threads の接続確認'
        type: choice
        options: [auto, '1', '2', '3', '4', '5', comments, check]
        default: auto
      dry_run:
        description: '投稿せず、何を投稿するかだけ表示する'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: affiliate-main
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KOTORI_THREADS_TOKEN: ${{ secrets.KOTORI_THREADS_TOKEN }}
      KOTORI_STORE_KEY: ${{ secrets.KOTORI_STORE_KEY }}
      PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
      PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
      # コメント返しの案を作るため（つぶやき用の AI: Gemini → 使えなければ Claude Sonnet）
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r _affiliate/requirements.txt

      - name: Threads の接続確認
        if: inputs.slot == 'check'
        run: python _affiliate/autopost.py --check

      - name: 今日の下書きがまだなければ作る（朝の下書き作りの起動が遅れたとき）
        if: github.event_name == 'schedule' || inputs.slot == 'auto'
        run: |
          day=$(TZ=Asia/Tokyo date +%F)
          hour=$(TZ=Asia/Tokyo date +%-H)
          if [ -f "_affiliate/drafts/$day.json" ] || [ "$hour" -lt 6 ]; then exit 0; fi
          since=$(date -u -d "$day 00:00 +0900" +%FT%TZ)
          n=$(gh run list --repo "${{ github.repository }}" --workflow affiliate_drafts.yml --limit 10 \
                --json createdAt --jq "[.[] | select(.createdAt >= \"$since\")] | length")
          if [ "$n" = "0" ]; then
            echo "今日の下書きがまだないので、下書き作りを始めます"
            gh workflow run affiliate_drafts.yml --repo "${{ github.repository }}" -f mode=drafts
          fi

      - name: 投稿時刻を少しずらす（毎日同じ時刻にならないように）
        if: github.event_name == 'schedule'
        run: sleep $((RANDOM % 240))

      - name: 投稿する
        id: post
        if: inputs.slot != 'check' && inputs.slot != 'comments'
        env:
          SLOT: ${{ inputs.slot || 'auto' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          git pull -q origin main
          if [ "$DRY_RUN" = "true" ]; then
            python _affiliate/autopost.py --slot "$SLOT" --dry-run
          else
            python _affiliate/autopost.py --slot "$SLOT"
          fi

      - name: コメントを確認して、返信文の案を作る
        id: comments
        if: (steps.post.outcome == 'success' || inputs.slot == 'comments') && inputs.dry_run != true
        continue-on-error: true
        run: |
          git pull -q origin main
          python _affiliate/comments.py

      - name: Pinterest（つながっていれば、時刻を過ぎた枠に1枚出す）
        id: pinterest
        if: inputs.slot != 'check' && inputs.dry_run != true
        continue-on-error: true
        run: |
          git pull -q origin main
          python _affiliate/pinterest_api.py post-due

      - name: 投稿の記録を保存する
        if: always() && (steps.post.outcome != 'skipped' || steps.pinterest.outcome != 'skipped' || inputs.slot == 'comments') && inputs.dry_run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _affiliate/data/posted _affiliate/data/push _affiliate/manual/comments.json _affiliate/manual/pins.json 2>/dev/null || git add _affiliate/data/posted
          git commit -m "投稿の記録を追加" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done

      - name: 新しいコメントをスマホに通知する
        if: steps.comments.outputs.new_comments != '' && steps.comments.outputs.new_comments != '0'
        env:
          N: ${{ steps.comments.outputs.new_comments }}
        run: |
          python _affiliate/push.py send --title "💬 新しいコメントが ${N} 件" \
            --body "返信文の案ができています。タップして確認" --url "https://keiyamada-ui.github.io/kotori/comments.html" --add "$N"

      - name: 今日のレポートにコメントする
        if: steps.post.outcome == 'success' && steps.post.outputs.report != ''
        env:
          REPORT: ${{ steps.post.outputs.report }}${{ steps.comments.outputs.report }}
          DAY: ${{ steps.post.outputs.date }}
        run: |
          gh label create "投稿レポート" --color B6D7A8 --description "自動投稿の結果" --force
          num=$(gh issue list --repo "${{ github.repository }}" --label "投稿レポート" --state all --limit 30 \
                --json number,title --jq "map(select(.title | endswith(\"$DAY\"))) | .[0].number // empty")
          if [ -z "$num" ]; then
            gh issue create --repo "${{ github.repository }}" --label "投稿レポート" \
              --title "📣 ことり 今日の投稿 $DAY" --body "$REPORT"
          else
            gh issue comment "$num" --repo "${{ github.repository }}" --body "$REPORT"
          fi

      - name: 失敗したら Issue で知らせる
        if: failure()
        run: |
          python _affiliate/push.py send --title "⚠️ Threads への自動投稿に失敗しました" \
            --body "次の枠で自動でやり直します。続くときは「お知らせ」を確認してください" \
            --url "https://keiyamada-ui.github.io/kotori/notices.html" || true
          gh issue create --repo "${{ github.repository }}" \
            --title "⚠️ Threads への自動投稿に失敗しました（$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')）" \
            --body "詳細: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          よくある原因:
          - Threads のアクセストークン（Secrets の KOTORI_THREADS_TOKEN）が未登録・期限切れ
          - Threads 側の一時的な不具合（次の枠で自動的にやり直します）
          - アカウントが制限・停止されている（Threads アプリで確認してください）"
