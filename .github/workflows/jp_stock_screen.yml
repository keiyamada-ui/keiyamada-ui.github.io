name: JP Stock Screen (日本株・手動ボタン)

on:
  workflow_dispatch:
    inputs:
      plan:
        description: 'J-Quantsのプラン（free=無料・約12週間前のデータ / light=最新）'
        required: true
        default: 'free'
        type: choice
        options:
          - free
          - light
      preset:
        description: 'スクリーニング条件'
        required: true
        default: 'quality'
        type: choice
        options:
          - quality
          - value
          - growth

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 日本株スクリーニング実行
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          PLAN: ${{ github.event.inputs.plan }}
          PRESET: ${{ github.event.inputs.preset }}
        run: |
          python - <<'PY'
          import os, sys, time, datetime, json
          import urllib.request, urllib.parse, urllib.error

          BASE = "https://api.jquants.com/v2"
          KEY = os.environ.get("JQUANTS_API_KEY", "")
          PLAN = os.environ.get("PLAN", "free")
          PRESET = os.environ.get("PRESET", "quality")

          # 日本株向けの条件（比率: 0.10 = 10%）
          PRESETS = {
              "quality": {"roe": ("gte", 0.10), "eq_ratio": ("gte", 0.40),
                          "margin": ("gte", 0.08), "per": ("lte", 20)},
              "value":   {"per": ("lte", 12), "pbr": ("lte", 1.0), "roe": ("gte", 0.08)},
              "growth":  {"growth": ("gte", 0.15), "roe": ("gte", 0.10), "margin": ("gte", 0.05)},
          }

          # Freeは直近12週間のデータが無いので、その分さかのぼる
          OFFSET_DAYS = 85 if PLAN == "free" else 0


          def get(path, params, wait):
              """GETしてpagination_keyを辿り全件返す。429はリトライ。"""
              out, params = [], dict(params)
              while True:
                  url = f"{BASE}{path}?{urllib.parse.urlencode(params)}"
                  req = urllib.request.Request(url, headers={"x-api-key": KEY})
                  for attempt in range(5):
                      try:
                          with urllib.request.urlopen(req, timeout=60) as r:
                              payload = json.loads(r.read().decode("utf-8"))
                          break
                      except urllib.error.HTTPError as e:
                          if e.code == 429:
                              time.sleep(30 * (attempt + 1))
                              continue
                          body = e.read().decode("utf-8", "ignore")[:200]
                          return None if e.code in (400, 403, 404) else sys.exit(f"APIエラー {e.code}: {body}")
                  else:
                      sys.exit("レート制限が解除されませんでした")
                  time.sleep(wait)
                  out += payload.get("data", [])
                  pk = payload.get("pagination_key")
                  if not pk:
                      return out
                  params["pagination_key"] = pk


          def num(v):
              try:
                  return float(v) if v not in (None, "") else None
              except (TypeError, ValueError):
                  return None


          def latest_prices(end):
              """endから過去にさかのぼり、株価がある最新日の全銘柄終値を返す"""
              d = end
              for _ in range(10):
                  if d.weekday() < 5:
                      rows = get("/equities/bars/daily", {"date": d.strftime("%Y%m%d")}, wait=13)
                      if rows:
                          return d, {r["Code"]: num(r.get("AdjC") or r.get("C")) for r in rows}
                  d -= datetime.timedelta(days=1)
              sys.exit("株価データが取得できませんでした（プラン設定を確認してください）")


          def collect_fins(start, end):
              """開示日ごとに決算サマリーを取得し、銘柄ごとに通期(FY)の決算を新しい順で保持"""
              fy = {}
              d = start
              while d <= end:
                  if d.weekday() < 5:
                      for r in get("/fins/summary", {"date": d.strftime("%Y%m%d")}, wait=1.1) or []:
                          if r.get("CurPerType") == "FY" and num(r.get("NP")) is not None:
                              fy.setdefault(r["Code"], []).append(r)
                  d += datetime.timedelta(days=1)
              for code in fy:
                  fy[code].sort(key=lambda r: r.get("CurPerEn", ""), reverse=True)
              return fy


          def metrics(fys, price):
              cur = fys[0]
              np_, eq, sales = num(cur.get("NP")), num(cur.get("Eq")), num(cur.get("Sales"))
              eps, bps, eqar = num(cur.get("EPS")), num(cur.get("BPS")), num(cur.get("EqAR"))
              prev_sales = None
              for r in fys[1:]:
                  if r.get("CurPerEn") != cur.get("CurPerEn"):
                      prev_sales = num(r.get("Sales"))
                      break
              return {
                  "roe": np_ / eq if np_ is not None and eq else None,
                  "margin": np_ / sales if np_ is not None and sales else None,
                  "eq_ratio": eqar,
                  "per": price / eps if price and eps and eps > 0 else None,
                  "pbr": price / bps if price and bps and bps > 0 else None,
                  "growth": (sales / prev_sales - 1) if sales and prev_sales else None,
                  "price": price,
              }


          def passes(m, crit):
              for f, (op, v) in crit.items():
                  x = m.get(f)
                  if x is None or (op == "gte" and x < v) or (op == "lte" and x > v):
                      return False
              return True


          def fmt(v, pct=False):
              if v is None:
                  return "-"
              return f"{v*100:.1f}%" if pct else f"{v:,.2f}"


          def main():
              if not KEY:
                  sys.exit("JQUANTS_API_KEY が未設定です（GitHub Secretに登録してください）")
              end = datetime.date.today() - datetime.timedelta(days=OFFSET_DAYS)
              # 前年決算と比べて売上成長を出すため約2年分（Freeの提供範囲内）
              start = datetime.date.today() - datetime.timedelta(days=725)

              names = {r["Code"]: r.get("CoName", "") for r in (get("/equities/master", {}, wait=13) or [])}
              pdate, prices = latest_prices(end)
              print(f"株価基準日: {pdate} / 銘柄数: {len(prices)}")
              fins = collect_fins(start, end)
              print(f"通期決算を取得した銘柄数: {len(fins)}")

              crit = PRESETS[PRESET]
              hits = []
              for code, fys in fins.items():
                  m = metrics(fys, prices.get(code))
                  if passes(m, crit):
                      m.update(code=code[:4], name=names.get(code, ""))
                      hits.append(m)
              hits.sort(key=lambda m: m["roe"] or 0, reverse=True)

              today = datetime.date.today().isoformat()
              lines = [f"# 日本株スクリーニング結果 ({today})", "",
                       f"- 条件: **{PRESET}** / プラン: {PLAN}",
                       f"- 株価基準日: {pdate}（Freeは約12週間前のデータ）",
                       f"- 対象: {len(fins)}社 → 合致: **{len(hits)}社**", "",
                       "| 順位 | コード | 銘柄名 | ROE | PER | PBR | 自己資本比率 | 純利益率 | 売上成長 |",
                       "|---|---|---|---|---|---|---|---|---|"]
              for i, m in enumerate(hits[:100], 1):
                  lines.append(f"| {i} | {m['code']} | {m['name']} | {fmt(m['roe'], True)} | "
                               f"{fmt(m['per'])} | {fmt(m['pbr'])} | {fmt(m['eq_ratio'], True)} | "
                               f"{fmt(m['margin'], True)} | {fmt(m['growth'], True)} |")
              lines += ["", "> ⚠️ 投資判断は自己責任で行ってください。"]
              os.makedirs("stock-reports", exist_ok=True)
              with open(f"stock-reports/jp_report_{today}.md", "w", encoding="utf-8") as f:
                  f.write("\n".join(lines))
              print(f"完了: {len(hits)}社が条件に合致")


          if __name__ == "__main__":
              main()
          PY
      - name: レポートをコミット
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add stock-reports/
          git commit -m "JP stock screen ($PRESET) $(date +%F)" || echo "変更なし"
          git pull --rebase
          git push
        env:
          PRESET: ${{ github.event.inputs.preset }}
