name: ことり 投稿下書き

on:
  schedule:
    # 毎朝 日本時間 5:15 に実行（GitHub は UTC なので 9 時間引いて 20:15）。7:40 の自動投稿に間に合わせる
    - cron: '15 20 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'drafts = 下書きを作る / themes = 今月のテーマを作り直す / check-api = 楽天APIの接続確認'
        type: choice
        options: [drafts, themes, check-api]
        default: drafts
      keyword:
        description: '（任意）テーマを使わず、このキーワードで探す 例: なわとび 子供'
        required: false
        default: ''
      source:
        description: 'keyword を使うときの検索先'
        type: choice
        options: [ichiba, books, travel]
        default: ichiba

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  # 下書き作り・自動投稿・フォームが同時に main に書き込まないよう、順番に動かす
  group: affiliate-main
  cancel-in-progress: false

jobs:
  drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
      RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
      RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # この Secret を登録すると Claude を優先して使い、使えないときは Gemini に自動で切り替わる
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # 投稿の反響（いいね数など）を取って、反響の大きかった話題の PR 投稿を作るため
      KOTORI_THREADS_TOKEN: ${{ secrets.KOTORI_THREADS_TOKEN }}
      # 勝ちパターン（参考投稿の分析結果）・ネタ帳を Issue から読むため
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 1. リポジトリを読み込む
        uses: actions/checkout@v4

      - name: 2. Python を準備する
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 3. 必要なツールをインストール
        run: pip install -r _affiliate/requirements.txt

      - name: 4. 仕組みの自己テスト
        run: python -m pytest -q _affiliate/tests

      - name: 5. 楽天APIの接続確認
        if: inputs.mode == 'check-api'
        run: python _affiliate/generate_drafts.py --check-api

      - name: 5. 下書きを作る
        id: generate
        if: github.event_name == 'schedule' || inputs.mode == 'drafts' || inputs.mode == 'themes'
        env:
          MODE: ${{ inputs.mode }}
          KEYWORD: ${{ inputs.keyword }}
          SOURCE: ${{ inputs.source }}
        run: |
          if [ "$MODE" = "themes" ]; then
            python _affiliate/generate_drafts.py --generate-themes
          elif [ -n "$KEYWORD" ]; then
            python _affiliate/generate_drafts.py --keyword "$KEYWORD" --source "$SOURCE"
          else
            python _affiliate/generate_drafts.py
          fi

      - name: 6. ラベルを用意する
        if: steps.generate.outcome == 'success'
        run: |
          gh label create "下書き" --color FFD966 --description "ことりの投稿下書き" --force
          gh label create "投稿レポート" --color B6D7A8 --description "自動投稿の結果" --force
          gh label create "ネタ帳" --color D9EAD3 --description "つぶやきのネタ（本人の出来事）" --force

      - name: 7a. 自動投稿モード：下書きを保存して、今日のレポートを作る
        if: steps.generate.outcome == 'success' && steps.generate.outputs.auto_post == 'true'
        env:
          TITLE: ${{ steps.generate.outputs.title }}
          DRAFT_PATH: ${{ steps.generate.outputs.draft_path }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _affiliate/drafts _affiliate/data _affiliate/manual
          git commit -m "下書きを追加: $TITLE" || echo "保存する変更なし"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
          day=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          rel=${DRAFT_PATH#"$GITHUB_WORKSPACE/"}
          gh issue create --repo "${{ github.repository }}" --label "投稿レポート" \
            --title "📣 ことり 今日の投稿 $day" \
            --body "$TITLE

          今日の下書き: ${{ github.server_url }}/${{ github.repository }}/blob/main/$rel

          このあと 7:40 集客投稿・10:10 つぶやき・12:20 役立つ投稿・15:40 つぶやき・20:10 PR 投稿 の5回、
          自動で Threads に投稿し、結果をこの Issue にコメントします。
          良くない投稿は Threads アプリで削除してください。自動投稿を止めたいときは _affiliate/config.yaml の auto_post.enabled を false に。"

      - name: 7b. 確認用の PR を作る
        if: steps.generate.outcome == 'success' && steps.generate.outputs.auto_post != 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: drafts/${{ github.run_id }}
          add-paths: |
            _affiliate/drafts/*.md
            _affiliate/drafts/*.json
            _affiliate/data/history/*.json
            _affiliate/data/themes/*.json
            _affiliate/data/snapshots/*.json
            _affiliate/manual/*.json
          commit-message: '投稿下書きを追加'
          title: ${{ steps.generate.outputs.title }}
          body-path: ${{ steps.generate.outputs.draft_path }}
          labels: 下書き
          delete-branch: true

      - name: AI の切り替えを知らせる（同じお知らせが開いている間は、新しく作らない）
        if: steps.generate.outputs.notice != ''
        env:
          NOTICE: ${{ steps.generate.outputs.notice }}
        run: |
          gh label create "AI切り替え" --color F4CCCC --description "Claude が使えず Gemini で作った" --force
          open=$(gh issue list --repo "${{ github.repository }}" --label "AI切り替え" --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -z "$open" ]; then
            gh issue create --repo "${{ github.repository }}" --label "AI切り替え" \
              --title "ℹ️ Claude が使えないため、Gemini で下書きを作っています" \
              --body "$NOTICE

          Claude をチャージ（または API キーを登録）したら、この Issue を Close してください。
          Close するまでは、毎日同じお知らせは届きません（下書きは Gemini で作り続けます）。"
          fi

      - name: 失敗したら Issue で知らせる
        if: failure()
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "⚠️ 投稿下書きの作成に失敗しました（$(TZ=Asia/Tokyo date +%Y-%m-%d)）" \
            --body "毎朝の下書き作成が失敗しました。エラーの内容はこちらで確認できます:
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          よくある原因:
          - 楽天の applicationId / accessKey / アフィリエイトID が Secrets に未登録、または間違っている
          - Gemini / Claude の API キーが未登録、または期限切れ
          - 楽天 API の URL（_affiliate/config.yaml）が変わった"
