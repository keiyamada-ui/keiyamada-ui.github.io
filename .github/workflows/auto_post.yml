name: AI News Auto Post

# サイトを「ことり」のまとめサイトに作り変えたため、自動実行は止めています（2026-10）。
# もう一度動かすときは、下の schedule を戻してください。昔の記事は _archive_ai_news に残しています。
on:
  workflow_dispatch: # 「今すぐ実行」ボタンだけ残す

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. リポジトリを読み込む
      uses: actions/checkout@v3

    - name: 2. Pythonを準備する
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 3. 必要なツールをインストール
      run: |
        pip install -r requirements.txt
        pip install requests

    - name: 4. AI記事作成＆SNS投稿＆アップロードを実行！
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        MY_GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
        THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      run: |
        python auto_curator.py
