name: 📝 ネタ帳（今日あったこと）
description: 実際にあった出来事を一言書くと、翌朝のつぶやきに使います（あなたの体験として書いてよいのは、ここに書いたことだけ）
title: "[ネタ帳] "
labels: ["ネタ帳"]
body:
  - type: markdown
    attributes:
      value: |
        子どもの一言、朝のバタバタ、習い事でのこと など、短くてOKです。
        翌朝 5時ごろの下書き作りで、つぶやき（短い投稿）にします。使ったら自動で閉じます。
        名前・学校名・場所など、個人が特定できることは書かないでください。
  - type: textarea
    id: memo
    attributes:
      label: あったこと
      placeholder: 例）朝、体操服を忘れたことに家を出てから気づいて走って取りに帰った
    validations:
      required: true
