# ことり｜子育て家族の"買ってよかった"まとめ — 投稿下書きの設定ファイル
#
# このファイルを書き換えるだけで、テーマ・検索キーワード・絞り込み条件を変えられます。
# 「#」で始まる行はメモ（プログラムは読みません）。

account:
  name: ことり
  threads_url: https://www.threads.com/@kotori.family
  persona: >-
    小学生の子をもつ親。子供の習い事・知育グッズ、家族旅行の宿、
    セールで買うべきものを、レビューと価格を比べてまとめている。

# 楽天ウェブサービスの窓口（エンドポイント）。
# 2026年の仕様変更で URL が変わったため、ここで一括管理する。
# 楽天側で再び変わった場合は、ここを書き換えるだけで直せる。
rakuten:
  referer: https://keiyamada-ui.github.io/
  endpoints:
    ichiba: https://openapi.rakuten.co.jp/ichibams/api/IchibaItem/Search/20220601
    books: https://openapi.rakuten.co.jp/services/api/BooksTotal/Search/20170404
    travel: https://openapi.rakuten.co.jp/engine/api/Travel/KeywordHotelSearch/20260731
  # 楽天の利用規約上、1秒に1回程度まで
  min_interval_seconds: 1.2

# 商品を候補に残す条件
filters:
  min_review_count: 20
  min_review_average: 4.0
  # 同じ商品を再び紹介するまでに空ける日数
  reuse_after_days: 60
  # AI に渡す候補の数
  max_candidates: 3

# 投稿のテーマ（柱）。日付に応じて順番に切り替わる。
# persona = 「誰が＋どんな条件で探しているか」。AI の書き出しの軸になる。
pillars:
  - id: kids_learning
    label: 子供の教育・習い事
    source: ichiba
    queries:
      - persona: 小学生の子に家でサッカーの練習をさせたい親
        keyword: サッカー 練習 子供
      - persona: 子供がひとりでリフティング練習できる道具を探している親
        keyword: リフティング ボール 子供
      - persona: 遊びながら考える力をつけさせたい小学生の親
        keyword: 知育玩具 小学生
      - persona: 子供が勉強に集中できる環境を作りたい親
        keyword: 学習タイマー 子供
      - persona: 運動が苦手な子に家でできる練習をさせたい親
        keyword: なわとび 子供 練習

  - id: kids_books
    label: 子供の本・図鑑
    source: books
    queries:
      - persona: 子供に図鑑で調べる習慣をつけたい親
        keyword: 図鑑 小学生
      - persona: サッカーをがんばる子に上達のヒントをあげたい親
        keyword: サッカー 上達 小学生
      - persona: 本を読まない子に1冊目を探している親
        keyword: 児童書 小学生 おすすめ

  - id: family_travel
    label: 家族のお出かけ・旅行
    source: travel
    queries:
      - persona: 子連れでディズニーに行くため、パーク近くの宿を探している家族
        keyword: 舞浜
      - persona: 子連れでディズニーに行くため、少し安めの近隣ホテルを探している家族
        keyword: 浦安
      - persona: 紅葉の季節に子連れで温泉に行きたい家族
        keyword: 箱根 家族
      - persona: 子連れで行きやすい温泉宿を探している家族
        keyword: 草津 子供

  - id: sale_prep
    label: セール前の"買っておくと助かる"もの
    source: ichiba
    queries:
      - persona: 寒くなる前に子供の防寒グッズをまとめて買いたい親
        keyword: 子供 ネックウォーマー
      - persona: 毎朝の支度を少しでもラクにしたい共働きの親
        keyword: 子供 ランドセル 収納
      - persona: 習い事の送り迎えで使える便利グッズを探している親
        keyword: 子供 水筒 1リットル
