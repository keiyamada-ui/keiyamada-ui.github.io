# ことり｜子育て家族の"買ってよかった"まとめ — 投稿下書きの設定ファイル
#
# このファイルを書き換えるだけで、テーマ・検索キーワード・絞り込み条件を変えられます。
# 「#」で始まる行はメモ（プログラムは読みません）。

account:
  name: ことり
  threads_url: https://www.threads.com/@kotori.family
  persona: >-
    小学生の子をもつ親。子供の習い事・知育グッズ、家族旅行の宿、
    セールで買うべきものを、レビューと価格を比べてまとめている。

# 楽天ウェブサービスの窓口（エンドポイント）。
# 2026年の仕様変更で URL が変わったため、ここで一括管理する。
# 楽天側で再び変わった場合は、ここを書き換えるだけで直せる。
rakuten:
  referer: https://keiyamada-ui.github.io/
  endpoints:
    ichiba: https://openapi.rakuten.co.jp/ichibams/api/IchibaItem/Search/20260701
    books: https://openapi.rakuten.co.jp/services/api/BooksTotal/Search/20170404
    travel: https://openapi.rakuten.co.jp/engine/api/Travel/KeywordHotelSearch/20260731
    # 推し商品フォームで宿のURLが貼られたとき、宿番号で1件を取る
    travel_hotel: https://openapi.rakuten.co.jp/engine/api/Travel/SimpleHotelSearch/20260731
    # ジャンル別ランキング（需要の判定に使う。つながらなくても下書きは作れる）
    ranking: https://openapi.rakuten.co.jp/ichibaranking/api/IchibaItem/Ranking/20220601
  # 楽天の利用規約上、1秒に1回程度まで（市場・ブックス・トラベル合わせて数える。余裕を持たせる）
  min_interval_seconds: 2.0

# 自動投稿（Threads）
auto_post:
  # false にすると自動投稿を止め、これまでどおり確認用の PR で届く
  enabled: true
  # この日より前は、リンク付きの PR 投稿をしない（アカウントを育てる期間）
  pr_posts_from: 2026-10-12
  # PR 投稿どうしの間隔（日）。1 にすると毎日
  pr_min_interval_days: 2
  # Threads のトークンを Secrets に登録した日。60日で切れるので、50日たったら Issue で知らせる
  token_updated: 2026-10-10
  # 投稿は1日5回（日本時間、毎回0〜15分ずらす）
  #   7:40 集客投稿 / 10:10 つぶやき / 12:20 役立つ投稿 / 15:40 つぶやき /
  #   20:10 PR 投稿（推し商品 → 反響のあった話題 → 今日の下書きの順。PR のない日は役立つ投稿の2本目かつぶやき）
  #   時刻は .github/workflows/affiliate_post.yml の cron で変えられる

# 使う AI（投稿の重要度ごと）。provider は claude か gemini。Claude が使えないときは自動で Gemini に切り替わる
ai:
  important:   # 集客投稿（ネット検索つき）・PR 投稿・役立つ投稿
    provider: claude
    model: claude-opus-5-5
    effort: high
  standard:    # テーマ作り・楽天ROOM のコメント・手動投稿ストック・参考投稿の分析
    provider: claude
    model: claude-sonnet-5-5
    effort: medium
  casual:      # つぶやき・コメント返しの案（Gemini が使えないときは Claude Sonnet）
    provider: gemini

# 集客投稿（朝・宣伝なし）: ニュース・トレンドから話題を拾い、ネット検索で深掘りして書く
buzz:
  enabled: true
  # Google ニュースで探す言葉（増やす・変えるのは自由）
  queries: [子育て, 小学生 親, 習い事, 小学校 保護者, 子連れ おでかけ]

# つぶやき（短い日常の投稿）: 1日に作る本数（午前・午後＋夜の予備）
casual:
  enabled: true
  per_day: 3

# 反響のあった集客投稿から、その話題の商品の PR 投稿を作る
followup:
  enabled: true
  # いいねがこの数以上、かつ最近の投稿のいいねの中央値の2倍以上で「反響あり」
  min_likes: 10

# 手動投稿ストック（BAN 対策）: 自動投稿とは別のテーマ・別の商品で、毎朝1セット作ってためておく。
# スマホの「✋ 手動投稿ストック」ページから選んでコピーし、自分の手で投稿する
manual_stock:
  enabled: true

# 楽天ROOM: 毎朝、ROOM に載せる商品とコメントを用意する（楽天市場・楽天ブックスの商品のみ）
room:
  # 1日の件数。慣れてきたら 10 くらいまで増やしてよい
  per_day: 6
  # 本は ROOM で毎回検索する手間がかかるので、1日この件数まで（残りは楽天市場の商品）
  max_books: 1
  # セール（お買い物マラソン・楽天スーパーSALE）の前の週と期間中の件数
  sale_per_day: 10
  # セールの日程（楽天が発表したら書き足す）。例:
  #   - {name: 楽天スーパーSALE, start: 2026-12-04, end: 2026-12-11}
  sales: []

# Pinterest のピン（画像・タイトル・説明・楽天のリンク）。毎朝作って、管理画面の「📌 Pinterest」に並べる
pinterest:
  enabled: true
  per_day: 2
  # ピンを入れるボード（Pinterest で同じ名前のボードを作っておく）
  boards: [小学生の習い事・知育, 子どもの本・図鑑, 子連れ旅行・おでかけ, 季節の準備・暮らし]
  # Pinterest API の窓口。審査の最初の段階（Trial）のあいだは https://api-sandbox.pinterest.com/v5、
  # 本番の許可（Standard）が出たら https://api.pinterest.com/v5 にする
  api_base: https://api-sandbox.pinterest.com/v5

# 商品を候補に残す条件
filters:
  min_review_count: 20
  min_review_average: 4.0
  # 同じ商品を再び紹介するまでに空ける日数
  reuse_after_days: 60
  # AI に渡す候補の数（AI が5つの基準で採点して1つ選ぶ）
  max_candidates: 5

# 発掘枠: まだ知られていない高評価アイテムを探す日（0=月曜 … 6=日曜）
hidden_gems:
  weekdays: [2, 5]
  min_review_average: 4.5
  min_review_count: 5
  max_review_count: 60

# 点数付けの重み（合計1になるように）
scoring:
  weights:
    demand: 0.30      # 需要（レビュー件数・ランキング）
    quality: 0.25     # 評価の高さ
    profit: 0.25      # 1件売れたときの報酬の目安（価格×料率）
    trend: 0.20       # 勢い（レビュー数の伸び）
  # 料率が取れない場合の目安（%）。楽天アフィリエイトの料率表で確認して調整する
  default_affiliate_rate:
    ichiba: 2.0
    books: 2.0
    travel: 1.0

# 悩み起点のテーマ
themes:
  # AI が月に1回、季節・行事・生活の悩みからテーマを考えて保存する数
  monthly_count: 30
  # 同じテーマを再び使うまでに空ける日数
  reuse_after_days: 21

# 固定テーマ（柱）。AI が考えたテーマと混ぜて使う。
# persona = 「誰が＋どんな条件で探しているか」。AI の書き出しの軸になる。
pillars:
  - id: kids_learning
    label: 子供の教育・習い事
    source: ichiba
    queries:
      - persona: 小学生の子に家でサッカーの練習をさせたい親
        keyword: サッカー 練習 子供
      - persona: 子供がひとりでリフティング練習できる道具を探している親
        keyword: リフティング ボール 子供
      - persona: 遊びながら考える力をつけさせたい小学生の親
        keyword: 知育玩具 小学生
      - persona: 子供が勉強に集中できる環境を作りたい親
        keyword: 学習タイマー 子供
      - persona: 運動が苦手な子に家でできる練習をさせたい親
        keyword: なわとび 子供 練習

  - id: kids_books
    label: 子供の本・図鑑
    source: books
    queries:
      - persona: 子供に図鑑で調べる習慣をつけたい親
        keyword: 図鑑 小学生
      - persona: サッカーをがんばる子に上達のヒントをあげたい親
        keyword: サッカー 上達 小学生
      - persona: 本を読まない子に1冊目を探している親
        keyword: 児童書 小学生 おすすめ

  - id: family_travel
    label: 家族のお出かけ・旅行
    source: travel
    queries:
      - persona: 子連れでディズニーに行くため、パーク近くの宿を探している家族
        keyword: 舞浜
      - persona: 子連れでディズニーに行くため、少し安めの近隣ホテルを探している家族
        keyword: 浦安
      - persona: 紅葉の季節に子連れで温泉に行きたい家族
        keyword: 箱根 家族
      - persona: 子連れで行きやすい温泉宿を探している家族
        keyword: 草津 子供

  - id: sale_prep
    label: セール前の"買っておくと助かる"もの
    source: ichiba
    queries:
      - persona: 寒くなる前に子供の防寒グッズをまとめて買いたい親
        keyword: 子供 ネックウォーマー
      - persona: 毎朝の支度を少しでもラクにしたい共働きの親
        keyword: 子供 ランドセル 収納
      - persona: 習い事の送り迎えで使える便利グッズを探している親
        keyword: 子供 水筒 1リットル
