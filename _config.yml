# ことり｜子育て家族の"買ってよかった"まとめ（GitHub Pages）
title: 'ことり｜子育て家族の"買ってよかった"まとめ'
description: 子育て中の家族向けに、楽天のレビューや評判をもとに「買ってよかった」と言われている物を、場面ごとにまとめています。
url: "https://keiyamada-ui.github.io"
lang: ja
timezone: Asia/Tokyo
future: false
author: ことり
threads: kotori.family
# Google AdSense のサイト運営者 ID（「ca-pub-」で始まる番号。公開しても大丈夫な番号）。
# 入れると、全ページに広告の読み込みと ads.txt が自動で付く。空のままなら広告は出ない
google_adsense: ""
# 記事の中に広告を置く「広告ユニット」の番号（AdSense の「広告ユニット」で作る。空なら自動広告だけ）
google_adsense_slot: ""
permalink: /:year/:month/:title/
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
exclude:
  - _affiliate
  - _archive_ai_news
  - auto_curator.py
  - requirements.txt
  - README.md
  - stock-reports
defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
